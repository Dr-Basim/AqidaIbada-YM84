<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصادر المعرفة الدينية — رحلة البصيرة التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'ToshA';
  src: url('assets/fonts/ToshA-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'ToshA';
  src: url('assets/fonts/ToshA-Medium.ttf') format('truetype');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'ToshA';
  src: url('assets/fonts/ToshA-Bold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --navy: #171444;
  --navy-deep: #0f0d2e;
  --navy-mid: #231f5e;
  --navy-soft: #eef0f8;
  --green: #0a8065;
  --green-dark: #07634e;
  --green-soft: #e6f5f1;
  --green-border: #9edac9;
  --cyan: #00aeda;
  --cyan-dark: #008cb0;
  --cyan-soft: #e5f7fc;
  --cyan-border: #94dff3;
  --muted: #717487;
  --line: #e6e8ef;
  --bg: #f6f7fa;
  --ink: #24243b;
  --card: #ffffff;
  --radius: 16px;

  --amber: #c27803;
  --amber-soft: #fef7e6;
  --amber-border: #f4d38a;
  --crimson: #c81e1e;
  --crimson-soft: #fdf2f2;
  --crimson-border: #f5b5b5;

  --font-heading: 'ToshA', 'Alexandria', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'Calibri', 'Calibri Regular', 'Segoe UI', Tahoma, Arial, sans-serif;

  --shadow-sm: 0 4px 14px rgba(23, 20, 68, 0.05);
  --shadow-md: 0 12px 32px rgba(23, 20, 68, 0.08);
  --shadow-lg: 0 22px 54px rgba(23, 20, 68, 0.14);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 17px;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 12% 6%, rgba(0, 174, 218, 0.08) 0%, transparent 36%),
    radial-gradient(circle at 88% 14%, rgba(10, 128, 101, 0.08) 0%, transparent 40%),
    linear-gradient(180deg, #f4f6fb 0%, #f7f8fc 100%);
  color: var(--ink);
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}

h1, h2, h3, h4, .heading-font {
  font-family: var(--font-heading);
  font-weight: 700;
  letter-spacing: -0.2px;
}

button {
  font-family: var(--font-body);
}

/* ==========================================================================
   حركات الرسوم المتجهة (SVG Keyframe Animations)
   ========================================================================== */
@keyframes svgDashFlow {
  from { stroke-dashoffset: 48; }
  to { stroke-dashoffset: 0; }
}
@keyframes svgDashReverse {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: 48; }
}
@keyframes svgOrbitSlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes svgOrbitReverse {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}
@keyframes svgPulseHalo {
  0%, 100% { transform: scale(1); opacity: 0.38; }
  50% { transform: scale(1.14); opacity: 0.72; }
}
@keyframes svgFloatGentle {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}
@keyframes svgBeamGlow {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 0.98; }
}
@keyframes svgStrokeDraw {
  from { stroke-dashoffset: 120; }
  to { stroke-dashoffset: 0; }
}
@keyframes turnEnter {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.anim-dash {
  stroke-dasharray: 8 6;
  animation: svgDashFlow 2.2s linear infinite;
}
.anim-dash-fast {
  stroke-dasharray: 6 5;
  animation: svgDashFlow 1.2s linear infinite;
}
.anim-orbit {
  transform-box: fill-box;
  transform-origin: center;
  animation: svgOrbitSlow 28s linear infinite;
}
.anim-orbit-rev {
  transform-box: fill-box;
  transform-origin: center;
  animation: svgOrbitReverse 22s linear infinite;
}
.anim-pulse {
  transform-box: fill-box;
  transform-origin: center;
  animation: svgPulseHalo 3.2s ease-in-out infinite;
}
.anim-float {
  animation: svgFloatGentle 4s ease-in-out infinite;
}
.anim-beam {
  animation: svgBeamGlow 2.8s ease-in-out infinite;
}

/* ==========================================================================
   الهيدر المتجهي الاحترافي (Animated Vector Hero Header)
   ========================================================================== */
.portal-hero {
  position: relative;
  background: linear-gradient(135deg, var(--navy) 0%, #1d1954 55%, #0c4f57 100%);
  color: #ffffff;
  padding: 28px 20px 68px;
  overflow: hidden;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.hero-vector-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.55;
}

.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 1220px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.hero-title-block {
  max-width: 720px;
}

.hero-kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(0, 174, 218, 0.45);
  border-radius: 999px;
  padding: 5px 15px;
  font-size: 13px;
  font-weight: 600;
  color: #e5f7fc;
  margin-bottom: 10px;
  backdrop-filter: blur(8px);
}

.hero-title-block h1 {
  margin: 0 0 8px;
  font-size: clamp(24px, 3.4vw, 36px);
  line-height: 1.3;
  color: #ffffff;
}

.hero-title-block p {
  margin: 0;
  font-size: 15px;
  color: rgba(255, 255, 255, 0.86);
  max-width: 640px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.hero-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: all 0.22s var(--ease-out);
}

.hero-btn:hover {
  background: rgba(0, 174, 218, 0.24);
  border-color: var(--cyan);
  transform: translateY(-1px);
}

.hero-btn.accent {
  background: var(--green);
  border-color: rgba(158, 218, 201, 0.45);
}

.hero-btn.accent:hover {
  background: var(--green-dark);
}

/* ==========================================================================
   خريطة البصيرة المعرفية (Interactive SVG Knowledge Space DAG)
   ========================================================================== */
.constellation-shell {
  max-width: 1220px;
  margin: -42px auto 22px;
  padding: 0 18px;
  position: relative;
  z-index: 10;
}

.constellation-card {
  background: linear-gradient(180deg, #ffffff 0%, #f9fafd 100%);
  border: 1px solid rgba(23, 20, 68, 0.1);
  border-radius: var(--radius);
  box-shadow: 0 18px 42px rgba(23, 20, 68, 0.08), 0 3px 10px rgba(23, 20, 68, 0.04);
  padding: 18px 22px;
}

.constellation-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.constellation-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.constellation-brand h2 {
  margin: 0;
  font-size: 16.5px;
  color: var(--navy);
}

.constellation-stats {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  color: var(--muted);
}

.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--line);
  font-weight: 600;
  color: var(--ink);
}

.stat-dot-svg {
  width: 10px;
  height: 10px;
  flex-shrink: 0;
}

.dag-scroll-wrap {
  width: 100%;
  overflow-x: auto;
  padding: 8px 10px;
  border-radius: 14px;
  background: linear-gradient(180deg, #f7f9fd 0%, #eff3fa 100%);
  border: 1px solid #e1e6f2;
  box-shadow: inset 0 1px 3px rgba(23, 20, 68, 0.04);
}

.dag-svg {
  width: 100%;
  min-width: 920px;
  height: 286px;
  display: block;
}

.dag-node-group {
  cursor: pointer;
  transition: transform 0.22s var(--ease-out);
}

.dag-node-group:hover {
  filter: brightness(0.97);
}

/* ==========================================================================
   مساحة التعلم المزدوجة (Split Adaptive Learning Studio)
   ========================================================================== */
.studio-grid {
  max-width: 1220px;
  margin: 0 auto 56px;
  padding: 0 18px;
  display: grid;
  grid-template-columns: 440px 1fr;
  gap: 22px;
  align-items: start;
}

@media (max-width: 1024px) {
  .studio-grid {
    grid-template-columns: 1fr;
  }
}

/* العمود البصري المتجهي التفاعلي */
.lab-panel {
  position: sticky;
  top: 18px;
  background: linear-gradient(180deg, #ffffff 0%, #f9fafd 100%);
  border: 1px solid rgba(23, 20, 68, 0.11);
  border-radius: var(--radius);
  box-shadow: 0 22px 50px rgba(23, 20, 68, 0.12), 0 4px 14px rgba(23, 20, 68, 0.05);
  overflow: hidden;
}

@media (max-width: 1024px) {
  .lab-panel {
    position: static;
  }
}

.lab-header {
  background: linear-gradient(135deg, #15123f 0%, #241f63 60%, #114b59 100%);
  color: #ffffff;
  padding: 15px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.lab-header-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--font-heading);
  font-size: 15.5px;
  line-height: 1.45;
}

.mastery-meter-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(0, 174, 218, 0.48);
  padding: 5px 13px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  color: #e5f7fc;
  white-space: nowrap;
  flex-shrink: 0;
  backdrop-filter: blur(6px);
}

.lab-svg-stage {
  background: radial-gradient(circle at 50% 24%, #241f69 0%, #14113d 62%, #0c0a26 100%);
  padding: 14px;
  min-height: 296px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: inset 0 4px 18px rgba(0, 0, 0, 0.28);
}

.lab-svg-stage svg {
  width: 100%;
  height: auto;
  max-height: 316px;
  display: block;
}

.lab-controls {
  padding: 12px 14px;
  background: #f1f4fa;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.lab-ctrl-btn {
  flex: 1 1 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 13px;
  font-size: 14.5px;
  font-weight: 700;
  border-radius: 11px;
  border: 1px solid #dce1ee;
  background: #ffffff;
  color: var(--ink);
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(23, 20, 68, 0.04);
  transition: all 0.22s var(--ease-out);
}

.lab-ctrl-btn:hover {
  border-color: var(--cyan);
  color: var(--navy);
  transform: translateY(-1px);
}

.lab-ctrl-btn.active {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
  color: #ffffff;
  border-color: var(--navy);
  box-shadow: 0 6px 16px rgba(23, 20, 68, 0.24);
}

.lab-ctrl-btn.active-green {
  background: linear-gradient(135deg, #0d9475 0%, var(--green) 100%);
  color: #ffffff;
  border-color: var(--green);
  box-shadow: 0 6px 16px rgba(10, 128, 101, 0.28);
}

.lab-ctrl-btn.active-crimson {
  background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
  color: #ffffff;
  border-color: var(--crimson);
  box-shadow: 0 6px 16px rgba(200, 30, 30, 0.28);
}

.lab-caption {
  margin: 12px 14px 14px;
  padding: 12px 15px;
  font-size: 15.2px;
  color: var(--ink);
  border: 1px solid #e4e9f4;
  border-right: 4px solid var(--cyan);
  border-radius: 12px;
  background: #f8fafd;
  line-height: 1.75;
}

.lab-folio-bar {
  padding: 11px 16px;
  background: var(--navy-soft);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.folio-link-btn {
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: 10px;
  border: 1px solid rgba(23, 20, 68, 0.16);
  background: var(--card);
  color: var(--navy);
  font-size: 13.2px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
}

.folio-link-btn:hover {
  background: var(--navy);
  color: #ffffff;
}

/* ==========================================================================
   عمود الحوار التفاعلي المتكيّف (Conversational Adaptive Stream)
   ========================================================================== */
.dialogue-column {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.kc-banner-card {
  background: linear-gradient(135deg, #ffffff 0%, #f3f8fc 100%);
  border: 1px solid #dde4f0;
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: 0 12px 30px rgba(23, 20, 68, 0.07), 0 2px 6px rgba(23, 20, 68, 0.03);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  border-right: 5px solid var(--cyan);
}

.kc-banner-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.kc-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--green);
}

.kc-banner-meta h2 {
  margin: 0;
  font-size: clamp(19px, 2.4vw, 24px);
  color: var(--navy);
}

.kc-banner-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 11px;
  border: 1px solid #d8dfee;
  background: #ffffff;
  color: var(--navy);
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(23, 20, 68, 0.04);
  transition: all 0.2s var(--ease-out);
}

.icon-btn:hover {
  border-color: var(--cyan);
  background: var(--cyan-soft);
  color: var(--navy);
  transform: translateY(-1px);
}

.icon-btn.speaking {
  background: linear-gradient(135deg, var(--green) 0%, #0d9b7a 100%);
  border-color: var(--green);
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(10, 128, 101, 0.25);
}

.studio-audio-bar-note {
  width: 100%;
  margin-top: 4px;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(23, 20, 68, 0.04);
  border: 1px dashed rgba(23, 20, 68, 0.16);
  color: var(--navy);
  font-size: 14px;
  font-weight: 600;
  display: none;
}

.studio-audio-bar-note.visible {
  display: block;
}

/* بطاقات خطوات الحوار المتدرجة بتمايز بصري عميق */
.turn-stream {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.turn-card {
  background: linear-gradient(180deg, #ffffff 0%, #fcfdff 100%);
  border: 1px solid #dfe4f0;
  border-right: 5px solid var(--navy);
  border-radius: var(--radius);
  padding: 24px 26px;
  box-shadow: 0 14px 34px rgba(23, 20, 68, 0.065), 0 2px 8px rgba(23, 20, 68, 0.03);
  animation: turnEnter 0.38s var(--ease-out) both;
  position: relative;
}

.turn-card.socratic-hint {
  background: linear-gradient(145deg, #fffdf9 0%, #fef4dc 100%);
  border-color: var(--amber-border);
  border-right: 5px solid var(--amber);
  box-shadow: 0 14px 32px rgba(194, 120, 3, 0.09);
}

.turn-card.elaborative-anchor {
  background: linear-gradient(145deg, #ffffff 0%, #e8f7fc 100%);
  border-color: var(--cyan-border);
  border-right: 5px solid var(--cyan);
  box-shadow: 0 14px 34px rgba(0, 174, 218, 0.09);
}

.turn-card.activity-card {
  background: linear-gradient(145deg, #ffffff 0%, #f1f4fc 100%);
  border-color: #cfd7ec;
  border-right: 5px solid #241f63;
  box-shadow: 0 14px 34px rgba(23, 20, 68, 0.08);
}

.turn-card.verify-card {
  background: linear-gradient(145deg, #ffffff 0%, #eefaf6 100%);
  border-color: #b4e2d3;
  border-right: 5px solid #0d9488;
  box-shadow: 0 14px 34px rgba(10, 128, 101, 0.085);
}

.turn-card.mastery-achieved {
  background: linear-gradient(145deg, #ffffff 0%, #e2f5ee 100%);
  border-color: var(--green-border);
  border-right: 5px solid var(--green);
  box-shadow: 0 16px 38px rgba(10, 128, 101, 0.12);
}

.turn-card.spaced-recall {
  background: linear-gradient(145deg, #ffffff 0%, var(--navy-soft) 100%);
  border-color: #c5cbe3;
  border-right: 5px solid var(--navy);
}

.turn-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  margin-bottom: 12px;
  background: var(--navy-soft);
  color: var(--navy);
}

.turn-card.socratic-hint .turn-badge {
  background: rgba(194, 120, 3, 0.14);
  color: #925700;
}

.turn-card.elaborative-anchor .turn-badge {
  background: rgba(0, 174, 218, 0.14);
  color: var(--cyan-dark);
}

.turn-card.mastery-achieved .turn-badge {
  background: rgba(10, 128, 101, 0.14);
  color: var(--green-dark);
}

.turn-lead {
  margin: 0 0 14px;
  font-size: 17.5px;
  color: var(--ink);
  line-height: 1.85;
}

.sacred-verse-box {
  margin: 14px 0;
  padding: 16px 20px;
  border-radius: 14px;
  background: linear-gradient(135deg, #f1f7f5 0%, #edf1fa 100%);
  border: 1px solid rgba(10, 128, 101, 0.18);
  border-right: 4px solid var(--green);
  box-shadow: inset 0 1px 0 #ffffff;
  color: var(--navy);
  font-weight: 700;
  font-size: 17.5px;
  line-height: 1.95;
}

.sacred-verse-box .verse-ref {
  display: block;
  margin-top: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}

.turn-question {
  margin: 10px 0 16px;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 17.8px;
  color: var(--navy);
  line-height: 1.68;
}

/* خيارات الاستجابة الحوارية */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt-btn {
  width: 100%;
  text-align: right;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 13px;
  border: 1.5px solid #dfe4f0;
  background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
  box-shadow: 0 2px 6px rgba(23, 20, 68, 0.03);
  color: var(--ink);
  font-size: 16.8px;
  line-height: 1.72;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
}

.opt-btn:hover:not(:disabled) {
  border-color: var(--cyan);
  background: var(--cyan-soft);
  transform: translateX(-2px);
}

.opt-btn.selected {
  border-color: var(--navy);
  background: var(--navy-soft);
  box-shadow: 0 0 0 2px rgba(23, 20, 68, 0.08);
}

.opt-btn.correct-choice {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--navy);
  font-weight: 600;
}

.opt-btn.wrong-choice {
  border-color: var(--crimson-border);
  background: var(--crimson-soft);
  color: #7f1d1d;
  opacity: 0.78;
}

.opt-letter {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--bg);
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-heading);
  font-size: 13.5px;
  color: var(--navy);
  flex-shrink: 0;
  margin-top: 2px;
}

.opt-btn.selected .opt-letter {
  background: var(--navy);
  color: #ffffff;
  border-color: var(--navy);
}

.opt-btn.correct-choice .opt-letter {
  background: var(--green);
  color: #ffffff;
  border-color: var(--green);
}

.opt-btn.wrong-choice .opt-letter {
  background: var(--crimson);
  color: #ffffff;
  border-color: var(--crimson);
}

/* أزرار التثبّت الطبيعي (Metacognitive Commitment Bar) */
.commitment-bar {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 13px;
  background: var(--bg);
  border: 1px solid var(--line);
  display: none;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  animation: turnEnter 0.25s var(--ease-out) both;
}

.commitment-bar.visible {
  display: flex;
}

.commitment-prompt {
  font-size: 13.8px;
  font-weight: 600;
  color: var(--navy);
}

.commitment-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.commit-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 16px;
  border-radius: 11px;
  font-size: 13.8px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
  border: 1.5px solid transparent;
}

.commit-btn.sure {
  background: var(--green);
  color: #ffffff;
}

.commit-btn.sure:hover {
  background: var(--green-dark);
}

.commit-btn.tentative {
  background: var(--card);
  color: var(--navy);
  border-color: var(--cyan);
}

.commit-btn.tentative:hover {
  background: var(--cyan-soft);
}

/* ==========================================================================
   أنشطة البناء المفاهيمي والتلاشي التكيفي والفرز
   ========================================================================== */
.chain-builder {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
}

.chain-slots-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 10px;
}

.chain-slot {
  padding: 13px;
  border-radius: 13px;
  border: 1.5px dashed var(--cyan);
  background: var(--cyan-soft);
  min-height: 78px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  transition: all 0.2s var(--ease-out);
}

.chain-slot.fixed {
  border-style: solid;
  border-color: var(--line);
  background: var(--bg);
}

.chain-slot.filled {
  border-style: solid;
  border-color: var(--green);
  background: var(--green-soft);
}

.chain-slot.active-target {
  border-color: var(--navy);
  background: var(--navy-soft);
  box-shadow: 0 0 0 3px rgba(0, 174, 218, 0.2);
}

.slot-relation {
  font-size: 11.8px;
  font-weight: 700;
  color: var(--muted);
}

.slot-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
}

.token-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.token-chip {
  padding: 9px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 13.8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
}

.token-chip:hover:not(:disabled) {
  border-color: var(--cyan);
  background: var(--cyan-soft);
}

/* أنشطة الاستدلال المتلاشي تكيّفياً (Faded Worked Examples) */
.faded-steps-wrap {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 12px 0;
}

.faded-step-box {
  padding: 14px 16px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--bg);
}

.faded-step-box.faded-target {
  background: var(--card);
  border: 1.5px solid var(--cyan);
}

.faded-step-label {
  font-size: 12.2px;
  font-weight: 700;
  color: var(--green);
  margin-bottom: 4px;
}

.faded-step-text {
  font-size: 14.8px;
  color: var(--ink);
}

/* مختبر الفرز المفهومي (Matrix Sorter) */
.sorter-buckets {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}

.sorter-bucket {
  padding: 14px;
  border-radius: 13px;
  border: 2px solid var(--line);
  background: var(--bg);
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
}

.sorter-bucket.active-bucket {
  border-color: var(--navy);
  background: var(--navy-soft);
}

.sorter-bucket h4 {
  margin: 0 0 8px;
  font-size: 15px;
  color: var(--navy);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.bucket-placed-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 36px;
}

.placed-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--green-soft);
  border: 1px solid var(--green-border);
  font-size: 12.8px;
  color: var(--navy);
  font-weight: 600;
}

/* أزرار المتابعة والانتقال */
.primary-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 12px;
  border: none;
  background: var(--navy);
  color: #ffffff;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.22s var(--ease-out);
}

.primary-btn:hover {
  background: var(--green);
  transform: translateY(-1px);
}

.primary-btn.green {
  background: var(--green);
}

.primary-btn.green:hover {
  background: var(--green-dark);
}

.secondary-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--navy);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
}

.secondary-btn:hover {
  border-color: var(--cyan);
  background: var(--cyan-soft);
}

/* ==========================================================================
   بطاقات التأصيل العلمي والموسوعة المنظمة (Scholarly Reference Drawer)
   ========================================================================== */
.scholarly-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.scholarly-point {
  padding: 15px 17px;
  border-radius: 14px;
  background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
  border: 1px solid #e1e6f2;
  box-shadow: 0 4px 12px rgba(23, 20, 68, 0.035);
}

.scholarly-point h4 {
  margin: 0 0 6px;
  font-size: 15.2px;
  color: var(--navy);
}

.scholarly-point p {
  margin: 0;
  font-size: 16px;
  color: var(--ink);
  line-height: 1.78;
}

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(23, 20, 68, 0.58);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.drawer-backdrop.open {
  display: flex;
}

.drawer-modal {
  background: var(--card);
  border-radius: var(--radius);
  max-width: 920px;
  width: 100%;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--line);
}

.drawer-head {
  background: var(--navy);
  color: #ffffff;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.drawer-head h3 {
  margin: 0;
  font-size: 19px;
}

.drawer-close {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.24);
  color: #ffffff;
  border-radius: 10px;
  padding: 7px 13px;
  cursor: pointer;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.drawer-body {
  padding: 22px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.encyc-section {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 20px;
  background: var(--card);
}

.encyc-section h4 {
  margin: 0 0 10px;
  font-size: 17.5px;
  color: var(--navy);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.inline-feedback-note {
  margin-top: 10px;
  padding: 11px 14px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 600;
  display: none;
}

.inline-feedback-note.show {
  display: block;
}

.inline-feedback-note.ok {
  background: var(--green-soft);
  border: 1px solid var(--green-border);
  color: var(--green-dark);
}

.inline-feedback-note.warn {
  background: var(--amber-soft);
  border: 1px solid var(--amber-border);
  color: #8a5200;
}

/* ==========================================================================
   حزمة التحسين الأولى v2: هيكل تطبيق ملء الشاشة
   ========================================================================== */
html, body { height: 100%; }
body { overflow: hidden; font-family: var(--font-body); }

.topbar {
  position: fixed; inset-inline: 0; top: 0; height: 56px; z-index: 60;
  background: linear-gradient(135deg, #15123f 0%, #241f63 55%, #114b59 100%);
  color: #fff; display: flex; align-items: center; gap: 14px;
  padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 8px 28px rgba(15,13,46,.28);
}
.topbar-brand { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; flex-shrink: 0; }
.topbar-course { font-size: 11px; font-weight: 600; color: #bfe9f6; white-space: nowrap; }
.topbar-title { font-family: var(--font-heading); font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
.topbar-progress { display: flex; align-items: center; gap: 6px; margin-inline: 6px auto; overflow-x: auto; scrollbar-width: none; }
.topbar-progress::-webkit-scrollbar { display: none; }
.progress-dot {
  width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; cursor: pointer;
  border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06); color: #dfe6f4;
  font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  transition: all .2s var(--ease-out); padding: 0;
}
.progress-dot:hover { transform: scale(1.12); border-color: #fff; }
.progress-dot.unlocked { border-color: var(--cyan); color: #e5f7fc; }
.progress-dot.attention { border-color: #f4d38a; color: #fef7e6; }
.progress-dot.mastered { border-color: #34d399; background: rgba(10,128,101,.35); color: #a7f3d0; }
.progress-dot.active { background: #fff; color: var(--navy); border-color: #fff; box-shadow: 0 0 0 4px rgba(0,174,218,.3); }
.progress-count { font-size: 12.5px; font-weight: 700; color: #bfe9f6; white-space: nowrap; margin-inline-start: 6px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.top-btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.08); color: #fff;
  font-size: 13.5px; font-weight: 700; cursor: pointer; transition: all .2s var(--ease-out);
}
.top-btn:hover { background: rgba(255,255,255,.16); transform: translateY(-1px); }
.top-btn.accent { background: var(--green); border-color: var(--green); }
.top-btn.accent:hover { background: var(--green-dark); }
.top-btn.forced-disabled { opacity: .45; pointer-events: none; }

.app-shell {
  position: fixed; inset: 56px 0 0 0; display: grid;
  grid-template-columns: minmax(380px, 42%) 1fr; gap: 0; min-height: 0;
}
.stage-pane {
  position: relative; z-index: 3; min-height: 0; display: flex; flex-direction: column;
  padding: 14px 16px 14px; border-inline-end: 1px solid var(--line);
  background: linear-gradient(180deg, #fbfcff 0%, #f2f5fb 100%);
}
.stage-pane .lab-panel { position: static; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.stage-pane .lab-svg-stage { flex: 1; min-height: 0; }
.stage-pane .lab-svg-stage svg { width: 100%; height: 100%; max-height: 100%; }
.stage-pane .lab-caption { max-height: 118px; overflow-y: auto; flex-shrink: 0; }
.stage-audio {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 12px; background: #eef2fa; border-top: 1px solid var(--line);
}
.stage-audio .stage-audio-label { font-size: 13px; font-weight: 700; color: var(--navy); }
.stage-audio .icon-btn { padding: 6px 12px; font-size: 13.5px; }

.dialogue-pane { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.dialogue-column { padding: 14px 20px 30px; }
.kc-banner-card { position: sticky; top: 0; z-index: 20; padding: 12px 18px; }
.kc-objective { flex-basis: 100%; margin: 0; font-size: 14.5px; color: var(--ink); line-height: 1.75; }
.kc-objective strong { color: var(--green-dark, #07634e); }

/* طبقة خارطة البناء المعرفي */
.map-backdrop {
  position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center;
  padding: 18px; background: rgba(15,13,46,.62); backdrop-filter: blur(4px);
}
.map-backdrop.open { display: flex; }
.map-modal {
  background: #fff; border-radius: 18px; width: min(1220px, 96vw); max-height: 92dvh;
  display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg);
  border: 1px solid var(--line);
}
.map-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.map-head h2 { margin: 0; font-size: 18px; color: var(--navy); }
.map-head .constellation-stats { margin-inline-end: auto; }
.map-body { overflow: auto; padding: 8px 12px 14px; }
.map-body .dag-svg { min-width: 0; width: 100%; height: auto; }
.map-close {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--navy-soft); color: var(--navy);
  font-weight: 700; cursor: pointer;
}

/* الأدوار الحوارية المنتهية المطوية */
.turn-collapsed { display: flex; flex-direction: column; gap: 8px; padding: 10px 4px 2px; }
.collapsed-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px; border-radius: 12px; border: 1px dashed #c9d4ea; background: #f7f9fd;
  font-size: 14px; color: var(--muted);
}
.collapsed-row .expand-btn {
  border: 1px solid var(--cyan-border); background: var(--cyan-soft); color: var(--cyan-dark);
  border-radius: 9px; padding: 5px 12px; font-weight: 700; cursor: pointer; font-size: 13px; flex-shrink: 0;
}

/* نبض بصري عند تحديث المشهد بفعل إجابة */
@keyframes stagePulse {
  0% { box-shadow: 0 0 0 0 rgba(0,174,218,.0); }
  35% { box-shadow: 0 0 0 5px rgba(0,174,218,.45), 0 0 34px rgba(0,174,218,.35); }
  100% { box-shadow: 0 0 0 0 rgba(0,174,218,0); }
}
.lab-panel.stage-updated { animation: stagePulse 900ms var(--ease-out); }

@media (max-width: 1100px) {
  .app-shell { grid-template-columns: minmax(340px, 46%) 1fr; }
  .topbar-title { max-width: 220px; }
}
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .stage-pane { height: 40dvh; flex-shrink: 0; border-inline-end: none; border-bottom: 2px solid var(--line); padding: 10px 12px; }
  .stage-pane .lab-caption { display: none; }
  .dialogue-pane { min-height: 0; }
  .topbar-course { display: none; }
  .topbar-title { font-size: 13.5px; max-width: 150px; }
  .top-btn span { display: none; }
  .progress-count { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .lab-panel.stage-updated { animation: none; }
  html { scroll-behavior: auto; }
}



/* ==========================================================================
   حزمة الإصلاح الثانية v2.1: المسرح التشريحي، البطاقات العصرية، الخطوط المعتمدة
   ========================================================================== */
/* نطاق: يحافظ على المشاهد والبيانات كما هي ويعيد هندسة العرض فقط. */
:root {
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --surface-subtle: #fbfcff;
  --border-soft: rgba(23, 20, 68, 0.065);
  --border-control: rgba(23, 20, 68, 0.09);
  --shadow-card: rgba(23, 20, 68, 0.032) 0 2px 5px, rgba(23, 20, 68, 0.018) 0 14px 30px;
  --shadow-card-hover: rgba(23, 20, 68, 0.05) 0 4px 10px, rgba(23, 20, 68, 0.035) 0 20px 42px;
  --radius-card: 22px;
  --radius-control: 18px;
}
body { font-size: 16px; line-height: 1.65; }
button, input, textarea, select { font-family: var(--font-body); }

/* تقاسم الشاشة يعطي الحوار مساحة قراءة أوسع والمسرح حجماً مناسباً لنسبة المشهد ٥٢٠/٣٠٠. */
.app-shell { grid-template-columns: minmax(500px, 52vw) minmax(0, 1fr); }
.stage-pane { padding: 10px 12px; background: linear-gradient(180deg, #fbfcff 0%, #f4f7fc 100%); }
.stage-pane .lab-panel {
  border: 1px solid var(--border-soft);
  border-radius: 24px;
  box-shadow: var(--shadow-card);
  background: var(--surface);
  overflow: hidden;
}
.stage-pane .lab-header {
  flex: 0 0 48px; min-height: 48px; padding: 8px 14px; gap: 10px; flex-wrap: nowrap;
  background: linear-gradient(135deg, #171444 0%, #231f5e 58%, #114b59 100%);
}
.stage-pane .lab-header-title {
  min-width: 0; flex: 1 1 auto; gap: 8px; font-size: 14.5px; line-height: 1.35;
  overflow: hidden;
}
.stage-pane .lab-header-title #lab-title-text {
  display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stage-pane .mastery-meter-pill {
  flex: 0 0 auto; padding: 5px 11px; font-size: 12.5px; line-height: 1.35;
  font-family: var(--font-body);
}

/* قلب الإصلاح: صندوق بنسبة المشاهد الحقيقية نفسها، فلا يمتد الـ SVG ولا يختفي.
   يتقلص الصندوق كاملاً عند ضيق الارتفاع بينما تحافظ النسبة على كامل الرسم. */
.stage-pane .lab-svg-stage {
  flex: 0 1 auto; aspect-ratio: 520 / 300; min-height: 0; max-height: 100%;
  width: 100%; padding: 10px; align-items: center; justify-content: center;
  box-shadow: inset 0 4px 18px rgba(0, 0, 0, 0.24);
}
.stage-pane .lab-svg-stage > svg {
  width: 100%; height: 100%; max-width: 100%; max-height: 100%;
  display: block; flex: 0 1 auto;
}
.lab-panel .lab-controls {
  flex: 0 0 auto; min-height: 48px; padding: 8px 10px; gap: 8px; flex-wrap: nowrap;
  overflow-x: auto; overflow-y: hidden; align-items: stretch;
  background: var(--surface-soft); scrollbar-width: none;
}
.lab-panel .lab-controls::-webkit-scrollbar { display: none; }
.lab-panel .lab-ctrl-btn {
  flex: 1 0 max-content; min-height: 42px; padding: 7px 13px; border-radius: 9999px;
  white-space: nowrap; border: 1px solid var(--border-control); background: #ffffff;
  box-shadow: rgba(23, 20, 68, 0.045) 0 1px 2px; font-size: 14px; line-height: 1.45;
  transition: border-color .2s var(--ease-out), background .2s var(--ease-out), box-shadow .2s var(--ease-out), transform .2s var(--ease-out);
}
.lab-panel .lab-ctrl-btn:hover { border-color: rgba(0, 174, 218, .65); transform: translateY(-1px); }
.lab-panel .lab-caption {
  flex: 0 1 auto; max-height: 84px; overflow-y: auto; margin: 8px 10px 10px;
  padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.65;
  border: 1px solid var(--border-soft); border-inline-start: 4px solid var(--cyan);
  background: var(--surface-subtle);
}
.lab-panel .lab-folio-bar { flex: 0 0 42px; min-height: 42px; padding: 5px 10px; background: var(--surface-soft); }
.lab-panel .folio-link-btn {
  min-height: 34px; padding: 5px 12px; border-radius: 9999px; font-size: 12.8px;
  line-height: 1.4; border: 1px solid var(--border-control); background: #ffffff;
  box-shadow: rgba(23, 20, 68, .04) 0 1px 2px;
}
.lab-panel .folio-link-btn svg { flex: 0 0 auto; }
.stage-pane .stage-audio {
  flex: 0 0 44px; min-height: 44px; padding: 5px 10px; gap: 7px; flex-wrap: nowrap;
  overflow-x: auto; overflow-y: hidden; background: #f4f7fc;
  border-top: 1px solid var(--border-soft); scrollbar-width: none;
}
.stage-pane .stage-audio::-webkit-scrollbar { display: none; }
.stage-pane .stage-audio .stage-audio-label { flex: 0 0 auto; font-size: 12.8px; }
.stage-pane .stage-audio .icon-btn {
  flex: 0 0 auto; min-height: 36px; padding: 6px 12px; border-radius: 9999px;
  font-size: 13px; white-space: nowrap;
}
.stage-pane .stage-audio .studio-audio-bar-note { width: auto; flex: 0 1 auto; min-width: 0; }

/* قسم الحوار والبطاقات: سطح أبيض نقي، حدود رقيقة، نصف قطر واسع، ظل خفيف لا خطوط جانبية سميكة. */
.dialogue-pane { background: linear-gradient(180deg, #f9fbfe 0%, #f5f7fb 100%); }
.dialogue-pane .dialogue-column { padding: 12px 14px 28px; gap: 12px; max-width: none; }
.dialogue-pane .kc-banner-card {
  position: sticky; top: 0; z-index: 20; padding: 16px 20px; gap: 8px;
  background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
  border: 1px solid var(--border-soft); border-radius: 24px; box-shadow: var(--shadow-card);
}
.dialogue-pane .kc-banner-card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,174,218,.07), transparent 46%, rgba(10,128,101,.06));
}
.dialogue-pane .kc-banner-meta { position: relative; z-index: 1; gap: 3px; }
.dialogue-pane .kc-banner-meta h2 { font-size: clamp(19px, 1.8vw, 24px); line-height: 1.35; letter-spacing: -.2px; }
.dialogue-pane .kc-tag {
  position: relative; z-index: 1; font-family: var(--font-heading); font-size: 12px; letter-spacing: .1px;
}
.dialogue-pane .kc-objective { position: relative; z-index: 1; font-size: 15px; line-height: 1.7; color: #3c3f58; }
.dialogue-pane .kc-objective strong { font-family: var(--font-heading); color: var(--green-dark); }
.dialogue-pane .turn-stream { gap: 14px; }
.dialogue-pane .turn-card {
  background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-card);
  padding: 22px 24px; box-shadow: var(--shadow-card); overflow: hidden;
  transition: border-color .2s var(--ease-out), box-shadow .2s var(--ease-out);
}
.dialogue-pane .turn-card:hover { border-color: rgba(23,20,68,.1); box-shadow: var(--shadow-card-hover); }
.dialogue-pane .turn-card::before {
  content:""; position:absolute; top:0; bottom:0; inset-inline-start:0; width:3px;
  background: linear-gradient(180deg, rgba(23,20,68,.75), rgba(0,174,218,.45)); opacity:.8;
}
.dialogue-pane .turn-card.socratic-hint { background: #fffaf0; border-color: rgba(194,120,3,.2); }
.dialogue-pane .turn-card.socratic-hint::before { background: linear-gradient(180deg, #c27803, #f4d38a); }
.dialogue-pane .turn-card.elaborative-anchor { background: #fbfeff; border-color: rgba(0,174,218,.18); }
.dialogue-pane .turn-card.elaborative-anchor::before { background: linear-gradient(180deg, #00aeda, #9edac9); }
.dialogue-pane .turn-card.activity-card { background: #fcfdff; border-color: rgba(23,20,68,.11); }
.dialogue-pane .turn-card.activity-card::before { background: linear-gradient(180deg, #231f5e, #00aeda); }
.dialogue-pane .turn-card.verify-card { background: #fbfffd; border-color: rgba(10,128,101,.2); }
.dialogue-pane .turn-card.verify-card::before { background: linear-gradient(180deg, #0a8065, #34d399); }
.dialogue-pane .turn-card.mastery-achieved { background: #f5fcf9; border-color: rgba(10,128,101,.3); box-shadow: var(--shadow-card-hover); }
.dialogue-pane .turn-card.mastery-achieved::before { background: linear-gradient(180deg, #07634e, #34d399); }
.dialogue-pane .turn-card.spaced-recall { background: #fffdf9; }
.dialogue-pane .turn-badge {
  font-family: var(--font-heading); font-size: 12px; line-height: 1.45; padding: 5px 12px;
  border: 1px solid var(--border-soft); box-shadow: rgba(23,20,68,.03) 0 1px 2px;
}
.dialogue-pane .turn-lead { font-size: 16.5px; line-height: 1.75; color: #2f3148; }
.dialogue-pane .turn-question { font-size: 18px; line-height: 1.65; letter-spacing: -.1px; }
.dialogue-pane .sacred-verse-box {
  border-radius: 18px; padding: 15px 18px; border: 1px solid rgba(10,128,101,.16);
  border-inline-start: 4px solid var(--green); box-shadow: rgba(10,128,101,.03) 0 2px 8px;
  font-family: var(--font-body); font-size: 17px; line-height: 1.85;
}
.dialogue-pane .options-list { gap: 9px; }
.dialogue-pane .opt-btn {
  border-radius: var(--radius-control); border: 1px solid var(--border-control); background: #ffffff;
  padding: 13px 16px; font-size: 16px; line-height: 1.65;
  box-shadow: rgba(23,20,68,.028) 0 1px 3px;
  transition: border-color .2s var(--ease-out), background .2s var(--ease-out), box-shadow .2s var(--ease-out), transform .2s var(--ease-out);
}
.dialogue-pane .opt-btn:hover:not(:disabled) { border-color: rgba(0,174,218,.65); background: #f2fbfe; box-shadow: rgba(0,174,218,.08) 0 4px 12px; transform: translateX(-2px); }
.dialogue-pane .opt-btn:focus-visible, .lab-panel .lab-ctrl-btn:focus-visible, .top-btn:focus-visible, .progress-dot:focus-visible { outline: 3px solid rgba(0,174,218,.45); outline-offset: 2px; }
.dialogue-pane .opt-btn.selected { border-color: var(--navy); background: #eef0f8; box-shadow: 0 0 0 3px rgba(23,20,68,.08); }
.dialogue-pane .opt-btn.correct-choice { border-color: rgba(10,128,101,.55); background: var(--green-soft); }
.dialogue-pane .opt-btn.wrong-choice { border-color: rgba(200,30,30,.45); background: var(--crimson-soft); }
.dialogue-pane .opt-letter { width: 30px; height: 30px; border-radius: 9999px; border: 1px solid var(--border-control); background: #f8fafc; font-size: 13px; box-shadow: rgba(23,20,68,.03) 0 1px 2px; }
.dialogue-pane .commitment-bar { border-radius: 18px; padding: 12px 14px; background: var(--surface-soft); border: 1px solid var(--border-soft); }
.dialogue-pane .commit-btn { border-radius: 9999px; min-height: 42px; }
.dialogue-pane .inline-feedback-note { border-radius: 16px; padding: 11px 14px; font-family: var(--font-body); }
.dialogue-pane .scholarly-point { border-radius: 18px; border: 1px solid var(--border-soft); box-shadow: rgba(23,20,68,.025) 0 2px 6px; background: var(--surface-subtle); }
.dialogue-pane .turn-collapsed { padding: 4px 2px 2px; gap: 7px; }
.dialogue-pane .collapsed-row {
  border-radius: 9999px; padding: 8px 10px 8px 14px; border: 1px solid var(--border-soft);
  background: rgba(255,255,255,.78); box-shadow: rgba(23,20,68,.025) 0 1px 3px; font-size: 13.5px;
}
.dialogue-pane .collapsed-row .expand-btn { border-radius: 9999px; min-height: 34px; padding: 5px 13px; }
.topbar .topbar-title, .map-head h2, .lab-header-title, .turn-badge, .drawer-head h3 { font-family: var(--font-heading); }
.topbar .topbar-course, .lab-caption, .stage-audio-label { font-family: var(--font-body); }

/* على الجوال: دفعة واحدة للمسرح، ويُصمم الارتفاع من نسبة المشهد نفسها لا نسبة اعتباطية. */
@media (max-width: 900px) {
  /* تشخيص مؤكد بالقياس: أبناء الشبكة أنفسهم بقوا min-width:auto، فوسّعت
     الأبعاد الجوهرية للمحتوى مسار الشبكة إلى 421px داخل منفذ 390px.
     إلغاء الحد الجوهري عن أبناء الشبكة والسماح للنصوص المرنة بالانكماش
     يعيد المسار إلى 390px دون إخفاء المحتوى أو قصّه. */
  .app-shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .app-shell > * { min-width: 0; max-width: 100%; box-sizing: border-box; }
  .stage-pane { height: auto; max-height: calc(100dvh - 56px); padding: 7px 8px 8px; flex: 0 0 auto; }
  .stage-pane .lab-panel { min-width: 0; max-width: 100%; box-sizing: border-box; }
  .lab-panel .lab-header, .lab-panel .lab-controls, .lab-panel .stage-audio,
  .dialogue-pane .kc-banner-card, .dialogue-pane .turn-card, .dialogue-pane .opt-btn { min-width: 0; max-width: 100%; }
  .stage-pane .lab-header-title, .dialogue-pane .kc-banner-meta,
  .dialogue-pane .opt-btn > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  .dialogue-pane .sacred-verse-box, .dialogue-pane .turn-lead,
  .dialogue-pane .turn-question, .dialogue-pane .kc-objective { overflow-wrap: anywhere; }
  .topbar { overflow: hidden; }
  .topbar-progress { flex: 1 1 auto; min-width: 0; overflow-x: auto; }
  #progress-dots { flex: 0 0 auto; }
  .topbar-brand { flex: 0 1 150px; min-width: 0; }
  .topbar-actions { flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .topbar-actions::-webkit-scrollbar { display: none; }
  .stage-pane .lab-panel { flex: 0 0 auto; border-radius: 20px; }
  .stage-pane .lab-header { flex-basis: 44px; min-height: 44px; padding: 6px 10px; }
  .stage-pane .lab-header-title { font-size: 13px; }
  .stage-pane .mastery-meter-pill { padding: 4px 8px; font-size: 11.5px; }
  .stage-pane .lab-svg-stage { padding: 7px; max-height: min(42dvh, 100%); }
  .lab-panel .lab-controls { min-height: 45px; padding: 6px 7px; }
  .lab-panel .lab-caption { display: none; }
  .lab-panel .lab-folio-bar { flex-basis: 38px; min-height: 38px; padding: 4px 7px; }
  .stage-pane .stage-audio { flex-basis: 40px; min-height: 40px; padding: 4px 7px; }
  .dialogue-pane .dialogue-column { padding: 10px 10px 24px; }
  .dialogue-pane .kc-banner-card { border-radius: 20px; padding: 13px 15px; }
  .dialogue-pane .turn-card { border-radius: 20px; padding: 17px 16px; }
  .dialogue-pane .turn-lead { font-size: 15.8px; }
  .dialogue-pane .turn-question { font-size: 16.8px; }
  .dialogue-pane .opt-btn { padding: 11px 13px; font-size: 15.2px; }
  .dialogue-pane .opt-letter { width: 28px; height: 28px; }
}
@media (max-width: 1120px) and (min-width: 901px) {
  .app-shell { grid-template-columns: minmax(400px, 48vw) minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .dialogue-pane .turn-card, .dialogue-pane .opt-btn, .lab-panel .lab-ctrl-btn { transition: none; }
}

/* ==========================================================================
   حزمة الإصلاح الثالثة v2.2: تمرير طبيعي للصفحة، بطاقة محور مختصرة غير مثبتة،
   أزرار الاستماع عند نصوصها داخل البطاقات، سؤال التأمل بخط المتن
   ========================================================================== */
html { height: auto; }
body { overflow-y: auto; overflow-x: hidden; height: auto; min-height: 100vh; padding-top: 56px; }
.app-shell { position: static; inset: auto; align-items: start; }
.dialogue-pane { overflow: visible; height: auto; overscroll-behavior: auto; scrollbar-gutter: auto; }
@media (min-width: 901px) {
  .stage-pane { position: sticky; top: 56px; max-height: calc(100dvh - 56px); overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .stage-pane .lab-panel { flex: 0 0 auto; }
  .stage-pane .lab-svg-stage { flex: 0 0 auto; }
}
.kc-banner-card, .dialogue-pane .kc-banner-card { position: relative; top: auto; z-index: 1; padding: 12px 16px; gap: 6px; }
.dialogue-pane .kc-banner-meta { gap: 0; }
.dialogue-pane .kc-banner-meta h2 { font-size: clamp(18px, 1.7vw, 22px); }
.dialogue-pane .kc-objective { font-size: 14.5px; line-height: 1.65; margin-top: 2px; }
.turn-card, .kc-banner-card { scroll-margin-top: 70px; }
.turn-question, .dialogue-pane .turn-question { font-family: var(--font-body); font-weight: 700; }
.hidden-audio-host { display: none; }
.card-head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.audio-play-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; font-size: 13.5px; border-radius: 9999px; white-space: nowrap; }
.audio-play-btn span { white-space: nowrap; }
.dialogue-pane .studio-audio-bar-note { margin: 0 0 10px; }
@media (max-width: 900px) {
  .app-shell { grid-template-rows: auto auto; }
  .stage-pane { position: static; max-height: none; overflow: visible; }
  .stage-pane .lab-svg-stage { max-height: none; }
  .dialogue-pane .kc-objective { font-size: 14px; }
}
</style>
</head>
<body>

<!-- شريط علوي نحيف: عنوان الدرس، نقاط التقدم، الأدوات (حزمة التحسين الأولى v2) -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-course">العقيدة والعبادة — الثقافة الإسلامية</span>
    <span class="topbar-title">نظرة عامة حول مصادر المعرفة الدينية</span>
  </div>
  <div class="topbar-progress" aria-label="تقدمك في محاور الدرس">
    <div id="progress-dots" style="display:flex;gap:6px"></div>
    <span class="progress-count" id="progress-count"></span>
  </div>
  <div class="topbar-actions">
    <button type="button" class="top-btn" onclick="openConceptMap()" title="خارطة البناء المعرفي">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.7l6.6-3.4M8.7 13.3l6.6 3.4"/></svg>
      <span>الخارطة</span>
    </button>
    <button type="button" class="top-btn accent forced-disabled" id="btn-next-kc" onclick="gotoNextKC()" title="المحور التالي المتاح">
      <span>مواصلة</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </button>
    <button type="button" class="top-btn" onclick="openEncyclopedia()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>الموسوعة</span>
    </button>
    <button type="button" class="top-btn" onclick="openLearnerReport()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      <span>سجل الإتقان</span>
    </button>
    <button type="button" class="top-btn" onclick="resetAdaptiveJourney()" title="البدء من جديد">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span>من جديد</span>
    </button>
  </div>
</header>

<!-- خارطة البناء المعرفي في طبقة منبثقة: تُفتح بأيقونة ولا تحجز شاشة التعلم -->
<div class="map-backdrop" id="map-backdrop" onclick="handleMapBackdropClick(event)">
  <div class="map-modal" role="dialog" aria-modal="true" aria-labelledby="map-title">
    <div class="map-head">
      <h2 id="map-title">شبكة البناء المعرفي وترابط المفاهيم</h2>
      <div class="constellation-stats">
        <span class="stat-pill">
          <svg class="stat-dot-svg" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#0a8065"/></svg>
          <span>مُتقَن: <strong id="stat-mastered-count">٠ من ١٢</strong></span>
        <span class="stat-pill">
          <svg class="stat-dot-svg" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#00aeda"/></svg>
          <span>متاح للتعلم الآن</span>
        <span class="stat-pill">
          <svg class="stat-dot-svg" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#c27803"/></svg>
          <span>قيد التثبيت المفهومي</span>
      </div>
      <button type="button" class="map-close" onclick="closeConceptMap()">إغلاق ✕</button>
    </div>
    <div class="map-body">
      <div class="dag-scroll-wrap">
        <svg id="dag-svg" class="dag-svg" viewBox="0 0 1140 298" role="img" aria-label="شبكة المفاهيم الاثني عشر"></svg>
      </div>
    </div>
  </div>
</div>

<!-- هيكل تطبيق ملء الشاشة: المسرح يميناً ثابت والحوار يساراً بتمرير داخلي -->
<div class="app-shell">
  <div class="stage-pane">
  <aside class="lab-panel" aria-label="مختبر الرؤية التفاعلي">
    <div class="lab-header">
      <div class="lab-header-title">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#00aeda" stroke-width="2.2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span id="lab-title-text">المختبر البصري المتجه</span>
      </div>
      <div class="mastery-meter-pill" id="kc-mastery-pill">رسوخ المفهوم: ٠٪</div>
    </div>

    <div class="lab-svg-stage" id="lab-svg-container"></div>
    <div class="lab-controls" id="lab-controls-bar"></div>
    <div class="lab-caption" id="lab-caption-box"></div>

    <div class="lab-folio-bar">
      <button type="button" class="folio-link-btn" onclick="openCurrentKCScholarlyCard()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>عرض التأصيل العلمي والشواهد الكاملة لهذا المحور</span>
      </button>
    </div>
    <div class="hidden-audio-host" aria-hidden="true">
      <audio id="studio-audio-el" preload="none"></audio>
    </div>
  </aside>
  </div>

  <div class="dialogue-pane" id="dialogue-pane">
    <section class="dialogue-column" aria-live="polite">
      <div class="kc-banner-card">
        <div class="kc-banner-meta">
          <h2 id="active-kc-title">أثر المصدر في بناء المعرفة والإيمان والعمل</h2>
        </div>
        <p class="kc-objective" id="active-kc-objective"></p>
      </div>

      <div id="turn-collapsed" class="turn-collapsed"></div>
      <div id="turn-stream" class="turn-stream"></div>
    </section>
  </div>
</div>

<!-- نافذة الموسوعة العلمية وسجل البصيرة -->
<div class="drawer-backdrop" id="drawer-backdrop" onclick="handleBackdropClick(event)">
  <div class="drawer-modal" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h3 id="drawer-title">الموسوعة العلمية المنظمة للدرس</h3>
      <button type="button" class="drawer-close" onclick="closeDrawer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>إغلاق</span>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>
<script>
/* ==========================================================================
   ١. مكتبة الأيقونات المتجهة الصرفة (Zero-Emoji Vector Icons)
   ========================================================================== */
const ICONS = {
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
