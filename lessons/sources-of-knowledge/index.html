        '﴿وَٱلرَّٰسِخُونَ فِى ٱلْعِلْمِ يَقُولُونَ ءَامَنَّا بِهِۦ كُلٌّ مِّنْ عِندِ رَبِّنَا ۗ وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ الْأَلْبَٰبِ﴾ [آل عمران: ٧]'
      ]
    }
  }
};

/* ==========================================================================
   ٤. محرك الإتقان التكيفي وشبكة المتطلبات (Adaptive Mastery & DAG Engine)
   ========================================================================== */
const STORAGE_KEY = 'aqeedah_sources_adaptive_v3';
const KC_IDS = Object.keys(KNOWLEDGE_SPACE);

class AdaptiveMasteryEngine {
  constructor() {
    this.state = this.loadState() || this.createInitialState();
  }

  createInitialState() {
    const kcs = {};
    KC_IDS.forEach(id => {
      kcs[id] = {
        pMastery: 0.20,
        attempts: 0,
        correctFirstTry: 0,
        confidentHits: 0,
        illusionCount: 0,
        misconceptions: [],
        fadingMode: 'low',
        probeResolved: false,
        activityDone: false,
        verificationPassed: false,
        needsVerification: false,
        mastered: false
      };
    });
    return {
      version: 3,
      activeKC: 'KC1',
      usedQuestions: [],
      spacedQueue: [],
      kcs,
      events: []
    };
  }

  loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 3 || !parsed.kcs) return null;
      return parsed;
    } catch (_) {
      return null;
    }
  }

  saveState() {
    if (this.state.events.length > 250) {
      this.state.events = this.state.events.slice(-250);
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
    } catch (_) {}
  }

  reset() {
    this.state = this.createInitialState();
    this.saveState();
  }

  kcRecord(kcId) {
    return this.state.kcs[kcId];
  }

  masteredCount() {
    return KC_IDS.filter(id => this.state.kcs[id].mastered).length;
  }

  isUnlocked(kcId) {
    const prereqs = KNOWLEDGE_SPACE[kcId].prereqs || [];
    return prereqs.every(p => this.state.kcs[p].mastered);
  }

  /* مسح بالعرض أولاً (BFS) لإيجاد أقرب متطلب سابق غير متقن عند التعثر */
  findNearestPrereqGap(kcId, hintedPrereq) {
    if (hintedPrereq && KNOWLEDGE_SPACE[hintedPrereq] && !this.state.kcs[hintedPrereq].mastered) {
      return hintedPrereq;
    }
    const visited = new Set([kcId]);
    const queue = [...(KNOWLEDGE_SPACE[kcId].prereqs || [])];
    while (queue.length > 0) {
      const curr = queue.shift();
      if (visited.has(curr)) continue;
      visited.add(curr);
      if (!this.state.kcs[curr].mastered) return curr;
      (KNOWLEDGE_SPACE[curr].prereqs || []).forEach(p => queue.push(p));
    }
    return null;
  }

  /* تحديث تقدير الرسوخ المفهومي وفق دقة الإجابة ومستوى الجزم */
  recordProbeAttempt(kcId, isCorrect, commitment, isFirstTry, misconceptionText) {
    const rec = this.kcRecord(kcId);
    rec.attempts += 1;

    if (isCorrect) {
      if (isFirstTry && commitment === 'sure') {
        rec.correctFirstTry += 1;
        rec.confidentHits += 1;
        rec.pMastery = Math.min(0.96, rec.pMastery + (1 - rec.pMastery) * 0.58);
        rec.fadingMode = 'high';
      } else if (isFirstTry && commitment === 'tentative') {
        rec.correctFirstTry += 1;
        rec.pMastery = Math.min(0.92, rec.pMastery + (1 - rec.pMastery) * 0.38);
        rec.fadingMode = 'low';
        rec.needsVerification = true;
        this.scheduleSpacedReview(kcId, 2);
      } else {
        rec.pMastery = Math.min(0.90, rec.pMastery + (1 - rec.pMastery) * 0.32);
      }
    } else {
      if (commitment === 'sure') {
        rec.illusionCount += 1;
        rec.pMastery = Math.max(0.12, rec.pMastery * 0.55);
      } else {
        rec.pMastery = Math.max(0.15, rec.pMastery * 0.72);
      }
      rec.fadingMode = 'low';
      rec.needsVerification = true;
      if (misconceptionText && !rec.misconceptions.includes(misconceptionText)) {
        rec.misconceptions.push(misconceptionText);
      }
      this.scheduleSpacedReview(kcId, 2);
    }

    this.state.events.push({
      t: Date.now(),
      kc: kcId,
      correct: isCorrect,
      commitment,
      firstTry: isFirstTry
    });
    this.saveState();
  }

  recordActivityCompletion(kcId, cleanFirstTry) {
    const rec = this.kcRecord(kcId);
    rec.activityDone = true;
    const gain = cleanFirstTry ? 0.42 : 0.26;
    rec.pMastery = Math.min(0.96, rec.pMastery + (1 - rec.pMastery) * gain);
    if (!cleanFirstTry) {
      rec.needsVerification = true;
      this.scheduleSpacedReview(kcId, 2);
    }
    this.saveState();
  }

  recordVerificationResult(kcId, isCorrect) {
    const rec = this.kcRecord(kcId);
    if (isCorrect) {
      rec.verificationPassed = true;
      rec.pMastery = Math.max(0.88, Math.min(0.98, rec.pMastery + (1 - rec.pMastery) * 0.55));
      if (rec.activityDone) {
        rec.mastered = true;
      }
    } else {
      rec.pMastery = Math.max(0.35, rec.pMastery * 0.80);
      this.scheduleSpacedReview(kcId, 1);
    }
    this.saveState();
  }

  markQuestionUsed(qId) {
    if (qId && !this.state.usedQuestions.includes(qId)) {
      this.state.usedQuestions.push(qId);
      this.saveState();
    }
  }

  pickFollowUpQuestion(kcId, targetDifficulty) {
    const pool = KNOWLEDGE_SPACE[kcId].questionPool || [];
    const unused = pool.filter(q => !this.state.usedQuestions.includes(q.id));
    const candidates = unused.length > 0 ? unused : pool;
    const exact = candidates.find(q => q.difficulty === targetDifficulty);
    return exact || candidates[0] || null;
  }

  scheduleSpacedReview(kcId, offsetAfterMastered) {
    const alreadyQueued = this.state.spacedQueue.some(item => item.kcId === kcId && !item.done);
    if (alreadyQueued) return;
    this.state.spacedQueue.push({
      kcId,
      dueAtMastered: this.masteredCount() + offsetAfterMastered,
      done: false
    });
  }

  popDueSpacedReview(excludeKcId) {
    const mCount = this.masteredCount();
    const due = this.state.spacedQueue.find(
      item => !item.done && item.kcId !== excludeKcId && this.state.kcs[item.kcId].mastered && mCount >= item.dueAtMastered
    );
    return due || null;
  }

  nextRecommendedKC() {
    /* يعرض أقرب مفهوم جاهز للتعلم اكتملت متطلباته ولم يُتقن بعد */
    const ready = KC_IDS.find(id => !this.state.kcs[id].mastered && this.isUnlocked(id));
    if (ready) return ready;
    return KC_IDS.find(id => !this.state.kcs[id].mastered) || null;
  }
}

const engine = new AdaptiveMasteryEngine();

/* ==========================================================================
   ٥. متحكم الواجهة الحوارية والمختبر البصري والشبكة (Studio UI Controller)
   ========================================================================== */
let currentLabMode = null;
let turnCounter = 0;
let activeTurnSelections = {};

function $(id) {
  return document.getElementById(id);
}

/* رسم شبكة المفاهيم المترابطة (12-Node SVG Prerequisite DAG) */

/* ==========================================================================
   حزمة التحسين الأولى v2: نقطة تقدم، خارطة، ربط بصري، طي أدوار
   ========================================================================== */
function renderProgressDots() {
  const host = $('progress-dots');
  if (!host) return;
  host.innerHTML = KC_IDS.map((kcId, idx) => {
    const kc = KNOWLEDGE_SPACE[kcId];
    const rec = engine.kcRecord(kcId);
    const unlocked = engine.isUnlocked(kcId);
    let cls = 'progress-dot';
    if (rec.mastered) cls += ' mastered';
    else if (rec.attempts > 0 && rec.misconceptions.length > 0) cls += ' attention';
    else if (unlocked) cls += ' unlocked';
    if (engine.state.activeKC === kcId) cls += ' active';
    return `<button type="button" class="${cls}" title="${kc.title}" aria-label="${kc.shortLabel}" onclick="handleDAGNodeClick('${kcId}')">${rec.mastered ? '✓' : toAr(idx + 1)}</button>`;
  }).join('');
  const cEl = $('progress-count');
  if (cEl) cEl.textContent = `أُتقن ${toAr(engine.masteredCount())} من ${toAr(KC_IDS.length)}`;
  const nextId = engine.nextRecommendedKC();
  const btn = $('btn-next-kc');
  if (btn) {
    if (nextId && nextId !== engine.state.activeKC) btn.classList.remove('forced-disabled');
    else btn.classList.add('forced-disabled');
    btn.title = nextId ? `المحور التالي المتاح: ${KNOWLEDGE_SPACE[nextId].title}` : 'لا محور تالياً متاحاً الآن';
  }
}

function gotoNextKC() {
  const nextId = engine.nextRecommendedKC();
  if (nextId) loadKC(nextId);
}

function openConceptMap() {
  renderDAG();
  $('map-backdrop').classList.add('open');
}
function closeConceptMap() {
  $('map-backdrop').classList.remove('open');
}
function handleMapBackdropClick(e) {
  if (e.target.id === 'map-backdrop') closeConceptMap();
}

function pulseStage() {
  const panel = document.querySelector('.lab-panel');
  if (!panel) return;
  panel.classList.remove('stage-updated');
  void panel.offsetWidth;
  panel.classList.add('stage-updated');
}

/* معاينة بصرية فورية: اختيار جواب يحرّك المشهد قبل التثبيت */
function previewChoiceLab(kcId, ch) {
  if (!ch) return;
  if (ch.labMode) setLabScene(kcId, ch.labMode);
  else if (ch.correct) setLabScene(kcId, LAB_SCENES[kcId].defaultMode);
}

function setCollapsible(card, label, altLabel) {
  if (!card || card.dataset.collapsible === '1') return;
  card.dataset.collapsible = '1';
  card.dataset.collapseLabel = label;
  card.dataset.collapseAlt = altLabel || '';
}
function collapseCompletedTurns(except) {
  const host = $('turn-collapsed');
  const stream = $('turn-stream');
  if (!host || !stream) return;
  Array.from(stream.querySelectorAll('.turn-card[data-collapsible="1"]')).forEach(card => {
    if (except && except.includes(card)) return;
    if (card.dataset.collapsed === '1') return;
    card.dataset.collapsed = '1';
    const row = document.createElement('div');
    row.className = 'collapsed-row';
    row.innerHTML = `<span>✓ أُنجزت: ${card.dataset.collapseLabel || 'خطوة حوارية'}</span>`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'expand-btn';
    btn.textContent = 'عرض التفاصيل';
    btn.onclick = () => { expandTurn(card); };
    row.appendChild(btn);
    host.appendChild(row);
    card.dataset.collapseRowId = 'cr_' + (++turnCounter);
    row.id = card.dataset.collapseRowId;
    card.style.display = 'none';
  });
}
function expandTurn(card) {
  card.dataset.collapsed = '';
  card.style.display = '';
  const row = document.getElementById(card.dataset.collapseRowId);
  if (row) row.remove();
  smoothFocus(card);
}

function renderDAG() {
  const svg = $('dag-svg');
  const defsHtml = `
    <defs>
      <filter id="dagNodeShadow" x="-25%" y="-25%" width="150%" height="160%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#171444" flood-opacity="0.1"/>
      </filter>
    </defs>
  `;
  let edgesHtml = '';
  let nodesHtml = '';

  KC_IDS.forEach(kcId => {
    const kc = KNOWLEDGE_SPACE[kcId];
    (kc.prereqs || []).forEach(pId => {
      const p = KNOWLEDGE_SPACE[pId];
      const pMastered = engine.kcRecord(pId).mastered;
      const stroke = pMastered ? '#0a8065' : '#cbd5e1';
      const dashClass = pMastered ? 'anim-dash-fast' : '';
      let pathD = '';

      if (pId === 'KC7' && kcId === 'KC12') {
        /* مسار علوي انسيابي فوق المحورين ١٠ و١١ دون تقاطع مع النصوص أو الدوائر */
        pathD = `M${p.dag.x - 22},${p.dag.y} C436,70 186,70 ${kc.dag.x + 18},${kc.dag.y - 12}`;
      } else if (pId === 'KC3' && kcId === 'KC9') {
        /* انحدار انسيابي مبكر نحو المسار الرابع بعيداً عن عقدة الحسّ */
        pathD = `M${p.dag.x - 22},${p.dag.y} C${p.dag.x - 62},${kc.dag.y} ${kc.dag.x + 76},${kc.dag.y} ${kc.dag.x + 22},${kc.dag.y}`;
      } else if (kcId === 'KC10' && p.dag.y > kc.dag.y) {
        /* دخول أفقي مرتفع إلى المحور ١٠ بعيداً تماماً عن عنوانه السفلي */
        pathD = `M${p.dag.x - 22},${p.dag.y} C${p.dag.x - 74},${kc.dag.y} ${kc.dag.x + 72},${kc.dag.y} ${kc.dag.x + 22},${kc.dag.y}`;
      } else {
        const midX = (p.dag.x + kc.dag.x) / 2;
        pathD = `M${p.dag.x - 22},${p.dag.y} C${midX},${p.dag.y} ${midX},${kc.dag.y} ${kc.dag.x + 22},${kc.dag.y}`;
      }

      edgesHtml += `<path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${pMastered ? '2.3' : '1.6'}" class="${dashClass}"/>`;
    });
  });

  KC_IDS.forEach((kcId, idx) => {
    const kc = KNOWLEDGE_SPACE[kcId];
    const rec = engine.kcRecord(kcId);
    const unlocked = engine.isUnlocked(kcId);
    const isActive = engine.state.activeKC === kcId;

    let fill = '#ffffff';
    let ringColor = '#cbd5e1';
    let textColor = '#5b5e72';
    let pillStroke = 'rgba(23,20,68,0.08)';

    if (rec.mastered) {
      fill = '#e6f5f1';
      ringColor = '#0a8065';
      textColor = '#171444';
      pillStroke = 'rgba(10,128,101,0.28)';
    } else if (rec.attempts > 0 && rec.misconceptions.length > 0) {
      fill = '#fef7e6';
      ringColor = '#c27803';
      textColor = '#171444';
      pillStroke = 'rgba(194,120,3,0.32)';
    } else if (unlocked) {
      fill = '#e5f7fc';
      ringColor = '#00aeda';
      textColor = '#171444';
      pillStroke = 'rgba(0,174,218,0.32)';
    }

    const r = 18;
    const circ = +(2 * Math.PI * r).toFixed(1);
    const pct = rec.mastered ? 1 : rec.pMastery;
    const dash = +(circ * pct).toFixed(1);
    const pillW = Math.max(76, kc.shortLabel.length * 5.9 + 18);

    nodesHtml += `
      <g class="dag-node-group" transform="translate(${kc.dag.x}, ${kc.dag.y})" onclick="handleDAGNodeClick('${kcId}')">
        ${isActive ? `<circle cx="0" cy="0" r="25" fill="${ringColor}" fill-opacity="0.22" class="anim-pulse"/>` : ''}
        <circle cx="0" cy="0" r="${r}" fill="${fill}" stroke="#e6e8ef" stroke-width="2.5" filter="url(#dagNodeShadow)"/>
        <circle cx="0" cy="0" r="${r}" fill="none" stroke="${ringColor}" stroke-width="3.2" stroke-dasharray="${dash} ${circ}" transform="rotate(-90)"/>
        ${rec.mastered
          ? `<polyline points="-6,0 -2,4 6,-5" fill="none" stroke="#0a8065" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`
          : `<text x="0" y="4" text-anchor="middle" fill="${isActive ? '#171444' : textColor}" font-size="11.5" font-weight="700">${toAr(idx + 1)}</text>`
        }
        <rect x="${-(pillW / 2).toFixed(1)}" y="21" width="${pillW.toFixed(1)}" height="21" rx="10.5" fill="rgba(255,255,255,0.92)" stroke="${isActive ? ringColor : pillStroke}" stroke-width="${isActive ? '1.4' : '1'}"/>
        <text x="0" y="35.5" text-anchor="middle" fill="${isActive ? '#171444' : textColor}" font-size="11.5" font-weight="${isActive ? '700' : '600'}">${kc.shortLabel}</text>
      </g>
    `;
  });

  svg.innerHTML = defsHtml + `<g id="dag-edges">${edgesHtml}</g><g id="dag-nodes">${nodesHtml}</g>`;
  $('stat-mastered-count').textContent = `${toAr(engine.masteredCount())} من ${toAr(KC_IDS.length)}`;
  renderProgressDots();
}

function handleDAGNodeClick(kcId) {
  if (engine.isUnlocked(kcId) || engine.kcRecord(kcId).mastered || engine.state.activeKC === kcId) {
    closeConceptMap();
    loadKC(kcId);
    return;
  }
  closeConceptMap();
  /* إذا نقر الطالب على عقدة لم تكتمل متطلباتها بعد، نوضح له الترابط التأسيسي مع إتاحة الانتقال */
  const gapId = engine.findNearestPrereqGap(kcId) || KNOWLEDGE_SPACE[kcId].prereqs[0];
  const gapKC = KNOWLEDGE_SPACE[gapId];
  const targetKC = KNOWLEDGE_SPACE[kcId];
  openCustomModal(
    'ترابط البناء المعرفي',
    `
      <div class="encyc-section">
        <h4>بناء المفاهيم على أصولها السابقة</h4>
        <p style="margin:0 0 14px">يعتمد استيعاب محور <strong>«${targetKC.title}»</strong> على ترسيخ القاعدة السابقة له في <strong>«${gapKC.title}»</strong> حتى تتكامل حلقات الاستدلال دون فجوة.</p>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <button type="button" class="primary-btn green" onclick="closeDrawer(); loadKC('${gapId}')">
            <span>البدء بالمحور التأسيسي أولاً: ${gapKC.shortLabel}</span>
            ${ICONS.arrowLeft}
          </button>
          <button type="button" class="secondary-btn" onclick="closeDrawer(); loadKC('${kcId}', true)">
            <span>استكشاف هذا المحور مباشرة</span>
          </button>
        </div>
      </div>
    `
  );
}

/* تحديث المختبر البصري المتجهي */
function setLabScene(kcId, modeOverride) {
  const lab = LAB_SCENES[kcId];
  const mode = modeOverride || lab.defaultMode;
  currentLabMode = mode;

  $('lab-title-text').textContent = lab.title;
  $('lab-svg-container').innerHTML = lab.render(mode);
  $('lab-caption-box').textContent = lab.captions[mode] || '';
  pulseStage();

  $('lab-controls-bar').innerHTML = lab.modes.map(m => {
    let activeClass = '';
    if (m.id === mode) {
      activeClass = m.style === 'green' ? 'active-green' : (m.style === 'crimson' ? 'active-crimson' : 'active');
    }
    return `<button type="button" class="lab-ctrl-btn ${activeClass}" onclick="setLabScene('${kcId}', '${m.id}')">${m.label}</button>`;
  }).join('');

  updateMasteryPill(kcId);
}

function updateMasteryPill(kcId) {
  const rec = engine.kcRecord(kcId);
  const pct = rec.mastered ? 100 : Math.round(rec.pMastery * 100);
  $('kc-mastery-pill').textContent = `رسوخ المفهوم: ${toAr(pct)}٪`;
}

/* بدء محور معرفي وتوليد مساره التكيفي */
function loadKC(kcId, skipSpacedCheck = false) {
  stopStudioAudio();
  engine.state.activeKC = kcId;
  engine.saveState();

  const kc = KNOWLEDGE_SPACE[kcId];
  $('active-kc-title').textContent = kc.title;

  setLabScene(kcId, LAB_SCENES[kcId].defaultMode);
  renderDAG();

  const stream = $('turn-stream');
  stream.innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  activeTurnSelections = {};
  const col = $('turn-collapsed');
  if (col) col.innerHTML = '';
  const objEl = $('active-kc-objective');
  if (objEl) objEl.innerHTML = `<strong>غاية هذا المحور:</strong> ${kc.openingHook}`;

  /* فحص الاسترجاع المتباعد لمفهوم سابق احتاج دعماً */
  if (!skipSpacedCheck) {
    const dueSpaced = engine.popDueSpacedReview(kcId);
    if (dueSpaced) {
      appendSpacedRetrievalTurn(dueSpaced, kcId);
      return;
    }
  }

  startKCEntrySequence(kcId);
}

function appendSpacedRetrievalTurn(spacedItem, nextKcId) {
  const reviewKC = KNOWLEDGE_SPACE[spacedItem.kcId];
  const q = engine.pickFollowUpQuestion(spacedItem.kcId, 2) || reviewKC.entryProbe;
  const tId = 'turn_' + (++turnCounter);

  const card = document.createElement('div');
  card.className = 'turn-card spaced-recall';
  card.id = tId;
  card.innerHTML = `
    <div class="turn-badge">${ICONS.recall} <span>ترابط معرفي واستحضار نشط — ${reviewKC.shortLabel}</span></div>
    <p class="turn-lead">قبل الخوض في المحور الجديد، لنستحضر هذه القاعدة المتصلة بما سبق لتثبيت ترابط المنظومة في ذهنك:</p>
    <p class="turn-question">${q.stem}</p>
    <div class="options-list" id="${tId}_opts">
      ${q.choices.map((ch, idx) => `
        <button type="button" class="opt-btn" onclick="handleDirectQuestionChoice('${tId}', '${spacedItem.kcId}', ${idx}, 'spaced', '${nextKcId}')">
          <span class="opt-letter">${OPT_LETTERS[idx]}</span>
          <span>${ch.text}</span>
        </button>
      `).join('')}
    </div>
    <div class="inline-feedback-note" id="${tId}_fb"></div>
  `;
  card.dataset.questionJson = JSON.stringify(q);
  $('turn-stream').appendChild(card);
}

function startKCEntrySequence(kcId) {
  const kc = KNOWLEDGE_SPACE[kcId];
  const rec = engine.kcRecord(kcId);

  /* إذا كان الطالب قد أتقن هذا المحور سابقاً، نعرض بطاقة إتقانه مع خيار التحدي الإضافي أو مراجعة التأصيل */
  if (rec.mastered) {
    const doneCard = document.createElement('div');
    doneCard.className = 'turn-card mastery-achieved';
    doneCard.innerHTML = `
      <div class="turn-badge">${ICONS.award} <span>محور راسخ في شبكتك المعرفية</span></div>
      <p class="turn-lead">${kc.scholarlyCard.summary}</p>
      <div class="scholarly-grid">
        ${kc.scholarlyCard.points.map(p => `<div class="scholarly-point"><h4>${p.title}</h4><p>${p.body}</p></div>`).join('')}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px">
        <button type="button" class="secondary-btn" onclick="replayKC('${kcId}')">خوض الحوار التفاعلي مجدداً</button>
        ${renderNextKCButtonHtml()}
      </div>
    `;
    $('turn-stream').appendChild(doneCard);
    return;
  }

  /* الخطوة الحوارية الأولى: موقف استكشافي مع التزام معرفي */
  const q = kc.entryProbe;
  const tId = 'turn_' + (++turnCounter);
  activeTurnSelections[tId] = { selectedIdx: null, wrongCount: 0 };

  const card = document.createElement('div');
  card.className = 'turn-card';
  card.id = tId;
  card.innerHTML = `
    <div class="card-head-row">
      <div class="turn-badge" style="margin-bottom:0">${ICONS.compass} <span>منطلق التأمل والحوار</span></div>
      ${cardAudioButtonHtml('intro')}
    </div>
    <div class="studio-audio-bar-note" data-audio-note="intro" role="status"></div>
    ${q.verse ? `<div class="sacred-verse-box">${q.verse}</div>` : ''}
    <p class="turn-question">${q.stem}</p>
    <div class="options-list" id="${tId}_opts">
      ${q.choices.map((ch, idx) => `
        <button type="button" class="opt-btn" id="${tId}_opt_${idx}" onclick="selectProbeOption('${tId}', ${idx})">
          <span class="opt-letter">${OPT_LETTERS[idx]}</span>
          <span>${ch.text}</span>
        </button>
      `).join('')}
    </div>
    <div class="commitment-bar" id="${tId}_commit">
      <span class="commitment-prompt">كيف تجد رسوخ هذا الجواب في ذهنك الآن؟</span>
      <div class="commitment-btns">
        <button type="button" class="commit-btn sure" onclick="submitProbeCommitment('${tId}', '${kcId}', 'sure')">
          ${ICONS.check} <span>أجزم بهذا الجواب</span>
        </button>
        <button type="button" class="commit-btn tentative" onclick="submitProbeCommitment('${tId}', '${kcId}', 'tentative')">
          ${ICONS.compass} <span>أميل إليه وأودّ التثبّت</span>
        </button>
      </div>
    </div>
  `;
  $('turn-stream').appendChild(card);
}

function replayKC(kcId) {
  const rec = engine.kcRecord(kcId);
  rec.mastered = false;
  rec.probeResolved = false;
  rec.activityDone = false;
  rec.verificationPassed = false;
  rec.pMastery = 0.35;
  engine.saveState();
  loadKC(kcId, true);
}

function selectProbeOption(tId, idx) {
  const st = activeTurnSelections[tId];
  if (!st || st.locked) return;
  st.selectedIdx = idx;
  const _kcId = engine.state.activeKC;
  previewChoiceLab(_kcId, KNOWLEDGE_SPACE[_kcId].entryProbe.choices[idx]);
  document.querySelectorAll(`#${tId}_opts .opt-btn`).forEach((b, i) => {
    if (!b.disabled) b.classList.toggle('selected', i === idx);
  });
  $(`${tId}_commit`).classList.add('visible');
}

function submitProbeCommitment(tId, kcId, commitment) {
  const st = activeTurnSelections[tId];
  if (!st || st.selectedIdx === null || st.locked) return;

  const kc = KNOWLEDGE_SPACE[kcId];
  const probe = kc.entryProbe;
  const chosen = probe.choices[st.selectedIdx];
  const isFirstTry = st.wrongCount === 0;
  const optBtn = $(`${tId}_opt_${st.selectedIdx}`);

  $(`${tId}_commit`).classList.remove('visible');

  if (chosen.correct) {
    st.locked = true;
    optBtn.classList.remove('selected');
    optBtn.classList.add('correct-choice');
    document.querySelectorAll(`#${tId}_opts .opt-btn`).forEach(b => { b.disabled = true; });

    engine.recordProbeAttempt(kcId, true, commitment, isFirstTry, null);
    engine.markQuestionUsed(probe.id);
    updateMasteryPill(kcId);
    renderDAG();

    /* التفرع التكيفي بعد صحة الموقف الأول:
       ١. مصيب جازم من المحاولة الأولى -> تثبيت موجز + نشاط بتلاشٍ عالٍ (تحدٍّ أعلى دون إطالة مملة).
       ٢. مصيب متردد أو بعد تلميح سقراطي -> تأصيل تفصيلي مفكك + نشاط بتلاشٍ مساند متدرج. */
    setLabScene(kcId, LAB_SCENES[kcId].defaultMode);
    setCollapsible(document.getElementById(tId), 'خطوة السبر الافتتاحية');
    if (isFirstTry && commitment === 'sure') {
      appendAnchorAndNextStep(kcId, 'fast');
    } else {
      appendAnchorAndNextStep(kcId, 'scaffolded');
    }
  } else {
    st.wrongCount += 1;
    optBtn.classList.remove('selected');
    optBtn.classList.add('wrong-choice');
    optBtn.disabled = true;
    st.selectedIdx = null;

    engine.recordProbeAttempt(kcId, false, commitment, isFirstTry, chosen.misconception);
    updateMasteryPill(kcId);
    renderDAG();

    if (chosen.labMode) {
      setLabScene(kcId, chosen.labMode);
    }

    if (st.wrongCount === 1) {
      /* القاعدة السقراطية: لا نكشف الجواب الصحيح عند الخطأ الأول! نوجّه الطالب بسؤال كاشف للخلل المحدد */
      const prereqGapId = engine.findNearestPrereqGap(kcId, chosen.linkedPrereq);
      const prereqNote = prereqGapId
        ? `<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.65);border:1px solid var(--amber-border);font-size:13.5px">
             <strong>جسر تأسيسي متصل (${KNOWLEDGE_SPACE[prereqGapId].shortLabel}):</strong> ${KNOWLEDGE_SPACE[prereqGapId].scholarlyCard.summary}
           </div>`
        : '';

      const hintCard = document.createElement('div');
      hintCard.className = 'turn-card socratic-hint';
      hintCard.innerHTML = `
        <div class="turn-badge">${ICONS.hint} <span>وقفة تأمل في زاوية الخلل</span></div>
        <p class="turn-lead" style="margin-bottom:6px">${chosen.socraticHint}</p>
        ${prereqNote}
        <p style="margin:10px 0 0;font-size:13.5px;font-weight:700;color:#925700">تأمل التغيير الذي ظهر في المختبر البصري، ثم اختر الجواب الأقوم من الخيارين المتبقيين أعلاه.</p>
      `;
      $('turn-stream').appendChild(hintCard);
      smoothFocus(hintCard);
    } else {
      /* عند التعثر الثاني نثبّت الجواب الصحيح ونقدم شرحاً تفصيلياً كاملاً ثم سقالات بنائية */
      st.locked = true;
      probe.choices.forEach((c, idx) => {
        const b = $(`${tId}_opt_${idx}`);
        b.disabled = true;
        if (c.correct) b.classList.add('correct-choice');
      });
      setLabScene(kcId, LAB_SCENES[kcId].defaultMode);
      setCollapsible(document.getElementById(tId), 'خطوة السبر الافتتاحية — مع تلميحات');
      appendAnchorAndNextStep(kcId, 'remedial');
    }
  }
}

function appendAnchorAndNextStep(kcId, mode) {
  const kc = KNOWLEDGE_SPACE[kcId];
  const probe = kc.entryProbe;

  const anchorCard = document.createElement('div');
  anchorCard.className = 'turn-card elaborative-anchor';
  setCollapsible(anchorCard, 'بطاقة التأصيل — الشاهد والتفسير');

  let heading = 'إصابة سديدة — تأصيل القاعدة والانتقال لمرتبة التركيب';
  if (mode === 'scaffolded') {
    heading = 'استبصار سليم — لنرسّخ علّة القاعدة وشواهدها خطوةً بخطوة';
  } else if (mode === 'remedial') {
    heading = 'تجلية القاعدة العلمية ورفع اللبس المفهومي';
  }

  const detailedPointsHtml = (mode === 'scaffolded' || mode === 'remedial')
    ? `<div class="scholarly-grid">
         ${kc.scholarlyCard.points.map(p => `<div class="scholarly-point"><h4>${p.title}</h4><p>${p.body}</p></div>`).join('')}
       </div>`
    : '';

  anchorCard.innerHTML = `
    <div class="card-head-row">
      <div class="turn-badge" style="margin-bottom:0">${ICONS.anchor} <span>${heading}</span></div>
      ${cardAudioButtonHtml('summary')}
    </div>
    <div class="studio-audio-bar-note" data-audio-note="summary" role="status"></div>
    <p class="turn-lead">${probe.anchorExplanation}</p>
    <div class="sacred-verse-box">${probe.anchorVerse}</div>
    ${detailedPointsHtml}
  `;
  $('turn-stream').appendChild(anchorCard);

  /* يليه مباشرة النشاط البنائي التفاعلي بمستوى التلاشي المتكيّف مع حالة الطالب */
  appendAdaptiveStructuralActivity(kcId);
  collapseCompletedTurns([anchorCard]);
  smoothFocus(anchorCard);
}

/* عرض النشاط البنائي المتكيف (Concept Chain / Adaptive Faded Reasoning / Matrix Sorter) */
function appendAdaptiveStructuralActivity(kcId) {
  const kc = KNOWLEDGE_SPACE[kcId];
  const act = kc.adaptiveActivity;
  const rec = engine.kcRecord(kcId);
  const isHigh = rec.fadingMode === 'high';
  const aId = 'act_' + (++turnCounter);

  const card = document.createElement('div');
  card.className = 'turn-card activity-card';
  card.id = aId;

  if (act.type === 'concept_chain') {
    const slots = isHigh ? act.slotsHigh : act.slotsLow;
    const prompt = isHigh ? act.promptHigh : act.promptLow;
    activeTurnSelections[aId] = {
      slots: slots.map(s => ({ ...s, userVal: s.fixed || null })),
      hadMistake: false
    };

    card.innerHTML = `
      <div class="turn-badge">${ICONS.anchor} <span>${act.title}</span></div>
      <p class="turn-lead">${prompt}</p>
      <div class="chain-builder">
        <div class="chain-slots-row" id="${aId}_slots"></div>
        <div class="token-bank" id="${aId}_tokens">
          ${act.tokens.map((tok, ti) => `
            <button type="button" class="token-chip" id="${aId}_tok_${ti}" onclick="placeChainToken('${aId}', '${kcId}', ${ti})">${tok}</button>
          `).join('')}
        </div>
      </div>
      <div class="inline-feedback-note" id="${aId}_fb"></div>
    `;
    $('turn-stream').appendChild(card);
    renderChainSlots(aId);
    return;
  }

  if (act.type === 'faded_reasoning') {
    const steps = isHigh ? act.workedStepsHigh : act.workedStepsLow;
    const question = isHigh ? act.fadedQuestionHigh : act.fadedQuestionLow;
    activeTurnSelections[aId] = { hadMistake: false };

    card.innerHTML = `
      <div class="turn-badge">${ICONS.anchor} <span>${act.title}</span></div>
      <p class="turn-lead">${act.context}</p>
      <div class="faded-steps-wrap">
        ${steps.map(s => `
          <div class="faded-step-box">
            <div class="faded-step-label">${s.label}</div>
            <div class="faded-step-text">${s.text}</div>
          </div>
        `).join('')}
        <div class="faded-step-box faded-target">
          <div class="faded-step-label">الخطوة الاستنتاجية المطلوبة منك:</div>
          <p class="turn-question" style="margin:4px 0 12px;font-size:16px">${question}</p>
          <div class="options-list" id="${aId}_fopts">
            ${act.choices.map((ch, idx) => `
              <button type="button" class="opt-btn" id="${aId}_fopt_${idx}" onclick="handleFadedChoice('${aId}', '${kcId}', ${idx})">
                <span class="opt-letter">${OPT_LETTERS[idx]}</span>
                <span>${ch.text}</span>
              </button>
            `).join('')}
          </div>
        </div>
      </div>
      <div class="inline-feedback-note" id="${aId}_fb"></div>
    `;
    $('turn-stream').appendChild(card);
    return;
  }

  if (act.type === 'matrix_sorter') {
    activeTurnSelections[aId] = {
      activeBucket: act.buckets[0].id,
      placed: 0,
      total: act.items.length,
      hadMistake: false
    };
    card.innerHTML = `
      <div class="turn-badge">${ICONS.anchor} <span>${act.title}</span></div>
      <p class="turn-lead">${act.prompt}</p>
      <div class="sorter-buckets" id="${aId}_buckets">
        ${act.buckets.map((b, bi) => `
          <div class="sorter-bucket ${bi === 0 ? 'active-bucket' : ''}" id="${aId}_bkt_${b.id}" onclick="selectSorterBucket('${aId}', '${b.id}')">
            <h4><span>${b.title}</span></h4>
            <div class="bucket-placed-list" id="${aId}_list_${b.id}"></div>
          </div>
        `).join('')}
      </div>
      <div class="token-bank" id="${aId}_items">
        ${act.items.map((it, ii) => `
          <button type="button" class="token-chip" id="${aId}_item_${ii}" onclick="placeSorterItem('${aId}', '${kcId}', ${ii})">${it.text}</button>
        `).join('')}
      </div>
      <div class="inline-feedback-note" id="${aId}_fb"></div>
    `;
    $('turn-stream').appendChild(card);
  }
}

function renderChainSlots(aId) {
  const st = activeTurnSelections[aId];
  const nextBlankIdx = st.slots.findIndex(s => !s.userVal);
  $(`${aId}_slots`).innerHTML = st.slots.map((s, idx) => {
    let cls = 'chain-slot';
    if (s.fixed) cls += ' fixed';
    else if (s.userVal) cls += ' filled';
    else if (idx === nextBlankIdx) cls += ' active-target';
    return `
      <div class="${cls}">
        <span class="slot-relation">${s.relation}</span>
        <span class="slot-value">${s.userVal || 'اختر المفهوم المناسب من الأسفل'}</span>
      </div>
    `;
  }).join('');
}

function placeChainToken(aId, kcId, tokIdx) {
  const st = activeTurnSelections[aId];
  const targetIdx = st.slots.findIndex(s => !s.userVal);
  if (targetIdx === -1) return;

  const tokText = KNOWLEDGE_SPACE[kcId].adaptiveActivity.tokens[tokIdx];
  const expected = st.slots[targetIdx].answer;
  const fb = $(`${aId}_fb`);

  if (tokText === expected) {
    st.slots[targetIdx].userVal = tokText;
    $(`${aId}_tok_${tokIdx}`).disabled = true;
    $(`${aId}_tok_${tokIdx}`).style.opacity = '0.45';
    renderChainSlots(aId);

    if (st.slots.every(s => !!s.userVal)) {
      fb.className = 'inline-feedback-note show ok';
      fb.innerHTML = `${ICONS.check} اكتمل انتظام السلسلة المفهومية بدقة.`;
      engine.recordActivityCompletion(kcId, !st.hadMistake);
      updateMasteryPill(kcId);
      proceedToVerificationChallenge(kcId);
    } else {
      fb.className = 'inline-feedback-note show ok';
      fb.textContent = 'موضع سليم؛ أكمل الحلقة التالية المظللة.';
    }
  } else {
    st.hadMistake = true;
    fb.className = 'inline-feedback-note show warn';
    fb.textContent = `تأمل العلاقة الدلالية في «${st.slots[targetIdx].relation}»: هل ينسجم معها هذا الاختيار أم غيره أدقّ؟`;
  }
}

function handleFadedChoice(aId, kcId, idx) {
  const st = activeTurnSelections[aId];
  const ch = KNOWLEDGE_SPACE[kcId].adaptiveActivity.choices[idx];
  const btn = $(`${aId}_fopt_${idx}`);
  const fb = $(`${aId}_fb`);

  if (ch.correct) {
    btn.classList.add('correct-choice');
    document.querySelectorAll(`#${aId}_fopts .opt-btn`).forEach(b => { b.disabled = true; });
    fb.className = 'inline-feedback-note show ok';
    fb.innerHTML = `${ICONS.check} استنتاج برهاني محكم يربط المقدمات بنتيجتها الصحيحة.`;
    engine.recordActivityCompletion(kcId, !st.hadMistake);
    updateMasteryPill(kcId);
    proceedToVerificationChallenge(kcId);
  } else {
    st.hadMistake = true;
    btn.classList.add('wrong-choice');
    btn.disabled = true;
    fb.className = 'inline-feedback-note show warn';
    fb.textContent = ch.hint || 'أعد النظر في المقدمات أعلاه لاستخلاص النتيجة المطابقة لها.';
  }
}

function selectSorterBucket(aId, bucketId) {
  const st = activeTurnSelections[aId];
  st.activeBucket = bucketId;
  document.querySelectorAll(`#${aId}_buckets .sorter-bucket`).forEach(el => {
    el.classList.toggle('active-bucket', el.id === `${aId}_bkt_${bucketId}`);
  });
}

function placeSorterItem(aId, kcId, itemIdx) {
  const st = activeTurnSelections[aId];
  const item = KNOWLEDGE_SPACE[kcId].adaptiveActivity.items[itemIdx];
  const fb = $(`${aId}_fb`);

  if (item.bucket === st.activeBucket) {
    const pill = document.createElement('div');
    pill.className = 'placed-pill';
    pill.innerHTML = `${ICONS.check} <span>${item.text}</span>`;
    $(`${aId}_list_${st.activeBucket}`).appendChild(pill);
    $(`${aId}_item_${itemIdx}`).remove();
    st.placed += 1;

    if (st.placed === st.total) {
      fb.className = 'inline-feedback-note show ok';
      fb.innerHTML = `${ICONS.check} أتقنت التمييز بين جميع الأمثلة والشواهد في نصابها الصحيح.`;
      engine.recordActivityCompletion(kcId, !st.hadMistake);
      updateMasteryPill(kcId);
      proceedToVerificationChallenge(kcId);
    } else {
      fb.className = 'inline-feedback-note show ok';
      fb.textContent = `فرز سليم (${toAr(st.placed)} من ${toAr(st.total)}).`;
    }
  } else {
    st.hadMistake = true;
    fb.className = 'inline-feedback-note show warn';
    fb.textContent = `${item.hint} (يمكنك النقر على الخانة المقابلة في الأعلى لتبديل التصنيف).`;
  }
}

/* خطوة التثبّت الاستدلالي / التحدي الموازي لإثبات الرسوخ الحقيقي */
function proceedToVerificationChallenge(kcId) {
  const rec = engine.kcRecord(kcId);
  /* إن كان الطالب في المسار السريع الواثق نرفعه لسؤال تحليل عالٍ (مستوى ٣)، وإن احتاج دعماً نتحقق بسؤال موازٍ غير مكرر (مستوى ٢) */
  const targetDiff = rec.fadingMode === 'high' && !rec.needsVerification ? 3 : 2;
  const q = engine.pickFollowUpQuestion(kcId, targetDiff);

  if (!q) {
    finalizeKCMastery(kcId);
    return;
  }

  const vId = 'ver_' + (++turnCounter);
  const badgeLabel = targetDiff === 3 ? 'تحدي التعمق والتعليل الاستدلالي' : 'مسألة موازية لتثبيت الرسوخ';

  const card = document.createElement('div');
  card.className = 'turn-card verify-card';
  card.id = vId;
  card.innerHTML = `
    <div class="turn-badge">${ICONS.shield} <span>${badgeLabel}</span></div>
    <p class="turn-question">${q.stem}</p>
    <div class="options-list" id="${vId}_opts">
      ${q.choices.map((ch, idx) => `
        <button type="button" class="opt-btn" id="${vId}_opt_${idx}" onclick="handleDirectQuestionChoice('${vId}', '${kcId}', ${idx}, 'verify', '')">
          <span class="opt-letter">${OPT_LETTERS[idx]}</span>
          <span>${ch.text}</span>
        </button>
      `).join('')}
    </div>
    <div class="inline-feedback-note" id="${vId}_fb"></div>
  `;
  card.dataset.questionJson = JSON.stringify(q);
  $('turn-stream').appendChild(card);
  const _act = document.querySelector('.activity-card:not([data-collapsible])');
  if (_act) setCollapsible(_act, 'النشاط البنائي');
  collapseCompletedTurns();
  smoothFocus(card);
}

function handleDirectQuestionChoice(cardId, kcId, chosenIdx, mode, nextKcId) {
  const card = $(cardId);
  const q = JSON.parse(card.dataset.questionJson);
  const ch = q.choices[chosenIdx];
  const btn = card.querySelectorAll('.opt-btn')[chosenIdx];
  const fb = $(`${cardId}_fb`);

  if (ch.correct) {
    btn.classList.add('correct-choice');
    card.querySelectorAll('.opt-btn').forEach(b => { b.disabled = true; });
    engine.markQuestionUsed(q.id);

    if (mode === 'spaced') {
      const due = engine.state.spacedQueue.find(i => i.kcId === kcId && !i.done);
      if (due) due.done = true;
      engine.saveState();
      fb.className = 'inline-feedback-note show ok';
      fb.innerHTML = `${ICONS.check} استحضار راسخ! ننتقل الآن إلى محورنا الجديد.`;
      setTimeout(() => startKCEntrySequence(nextKcId), 650);
    } else {
      setLabScene(kcId, LAB_SCENES[kcId].defaultMode);
      engine.recordVerificationResult(kcId, true);
      updateMasteryPill(kcId);
      renderDAG();
      fb.className = 'inline-feedback-note show ok';
      fb.innerHTML = `${ICONS.check} برهان سديد يؤكد رسوخ هذا المفهوم وإتقانك لضوابطه.`;
      finalizeKCMastery(kcId);
    }
  } else {
    btn.classList.add('wrong-choice');
    btn.disabled = true;
    if (ch.labMode && mode !== 'spaced') {
      setLabScene(kcId, ch.labMode);
    }
    if (mode !== 'spaced') {
      engine.recordVerificationResult(kcId, false);
      updateMasteryPill(kcId);
    }
    fb.className = 'inline-feedback-note show warn';
    fb.textContent = ch.socraticHint || 'تأمل الضابط العلمي مرة أخرى ثم اختر الإجابة الأقوم مما تبقى.';
  }
}

function finalizeKCMastery(kcId) {
  const rec = engine.kcRecord(kcId);
  rec.mastered = true;
  rec.pMastery = Math.max(0.92, rec.pMastery);
  engine.saveState();
  updateMasteryPill(kcId);
  renderDAG();

  const kc = KNOWLEDGE_SPACE[kcId];
  const allDone = engine.masteredCount() === KC_IDS.length;

  const _ver = document.querySelector('.verify-card:not([data-collapsible])');
  if (_ver) setCollapsible(_ver, 'خطوة التحقق من الرسوخ');
  collapseCompletedTurns();
  const doneCard = document.createElement('div');
  doneCard.className = 'turn-card mastery-achieved';
  doneCard.innerHTML = `
    <div class="turn-badge">${ICONS.award} <span>${allDone ? 'تمّ بحمد الله إتقان منظومة الدرس كاملة' : 'ترسّخ هذا المحور وفُتحت مساراته اللاحقة'}</span></div>
    <p class="turn-lead">${kc.scholarlyCard.summary}</p>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">
      ${renderNextKCButtonHtml()}
      <button type="button" class="secondary-btn" onclick="openCurrentKCScholarlyCard()">مراجعة بطاقة الشواهد الكاملة</button>
    </div>
  `;
  $('turn-stream').appendChild(doneCard);
  smoothFocus(doneCard);
}

function renderNextKCButtonHtml() {
  const nextId = engine.nextRecommendedKC();
  if (!nextId) {
    return `<button type="button" class="primary-btn green" onclick="openLearnerReport()">
      ${ICONS.award} <span>عرض سجل البصيرة والختام الشامل</span>
    </button>`;
  }
  const nextKC = KNOWLEDGE_SPACE[nextId];
  return `<button type="button" class="primary-btn green" onclick="loadKC('${nextId}')">
    <span>المتابعة إلى: ${nextKC.title}</span> ${ICONS.arrowLeft}
  </button>`;
}

function smoothFocus(el) {
  setTimeout(() => {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 90);
}

/* ==========================================================================
   ٦. الموسوعة العلمية المنظمة وسجل البصيرة والنطق الصوتي
   ========================================================================== */
function openCustomModal(title, bodyHtml) {
  $('drawer-title').textContent = title;
  $('drawer-body').innerHTML = bodyHtml;
  $('drawer-backdrop').classList.add('open');
}

function closeDrawer() {
  $('drawer-backdrop').classList.remove('open');
}

function handleBackdropClick(e) {
  if (e.target.id === 'drawer-backdrop') closeDrawer();
}

function openCurrentKCScholarlyCard() {
  const kc = KNOWLEDGE_SPACE[engine.state.activeKC];
  const html = renderScholarlySectionHtml(kc, true);
  openCustomModal(`التأصيل العلمي والشواهد — ${kc.title}`, html);
}

function openEncyclopedia() {
  const html = KC_IDS.map(id => renderScholarlySectionHtml(KNOWLEDGE_SPACE[id], false)).join('');
  openCustomModal('الموسوعة العلمية الكاملة لمصادر المعرفة الدينية', html);
}

function renderScholarlySectionHtml(kc, singleMode) {
  const rec = engine.kcRecord(kc.id);
  const statusLabel = rec.mastered ? 'مُتقَن راسخ' : 'متاح للاستكشاف';
  return `
    <div class="encyc-section">
      <h4>
        <span>${kc.orderLabel}: ${kc.title}</span>
        ${!singleMode ? `<button type="button" class="secondary-btn" style="padding:6px 12px;font-size:12.5px" onclick="closeDrawer(); loadKC('${kc.id}', true)">الانتقال للحوار التفاعلي (${statusLabel})</button>` : ''}
      </h4>
      <p style="margin:0 0 12px;color:var(--ink)">${kc.scholarlyCard.summary}</p>
      <div class="scholarly-grid">
        ${kc.scholarlyCard.points.map(p => `<div class="scholarly-point"><h4>${p.title}</h4><p>${p.body}</p></div>`).join('')}
      </div>
      ${kc.scholarlyCard.evidences.map(ev => `<div class="sacred-verse-box" style="margin-bottom:0">${ev}</div>`).join('')}
    </div>
  `;
}

function openLearnerReport() {
  const mastered = engine.masteredCount();
  const pct = Math.round((mastered / KC_IDS.length) * 100);
  const allMisconceptions = [];
  KC_IDS.forEach(id => {
    engine.kcRecord(id).misconceptions.forEach(m => {
      allMisconceptions.push({ kcTitle: KNOWLEDGE_SPACE[id].shortLabel, text: m, resolved: engine.kcRecord(id).mastered });
    });
  });

  const html = `
    <div class="encyc-section" style="background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);color:#ffffff;border:none">
      <h4 style="color:#ffffff;margin-bottom:6px">خلاصة رحلتك المعرفية في الدرس</h4>
      <p style="margin:0;color:#e5f7fc">أتممت إتقان <strong>${toAr(mastered)} من ${toAr(KC_IDS.length)}</strong> محوراً معرفياً بنسبة رسوخ كلّية <strong>${toAr(pct)}٪</strong>.</p>
    </div>

    <div class="encyc-section">
      <h4>تفصيل حالة المحاور الاثني عشر</h4>
      <div class="scholarly-grid">
        ${KC_IDS.map((id, i) => {
          const rec = engine.kcRecord(id);
          const mPct = rec.mastered ? 100 : Math.round(rec.pMastery * 100);
          return `
            <div class="scholarly-point" style="border-right:4px solid ${rec.mastered ? 'var(--green)' : 'var(--cyan)'}">
              <h4>${toAr(i + 1)}. ${KNOWLEDGE_SPACE[id].shortLabel}</h4>
              <p>نسبة الرسوخ: <strong>${toAr(mPct)}٪</strong> — ${rec.mastered ? 'مُتقَن' : 'قيد الاستكمال'}</p>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <div class="encyc-section">
      <h4>اللبس المفهومي الذي جرت معالجته وتصحيحه أثناء الحوار</h4>
      ${allMisconceptions.length === 0
        ? '<p style="margin:0;color:var(--green);font-weight:600">لم يُسجَّل أي لبس مفهومي في استجاباتك حتى الآن — بصيرة منهجية متميزة.</p>'
        : `<div style="display:flex;flex-direction:column;gap:8px">
             ${allMisconceptions.map(item => `
               <div class="scholarly-point">
                 <h4>${item.kcTitle} — ${item.resolved ? 'تمّت معالجته وترسيخ الصواب' : 'قيد التثبيت'}</h4>
                 <p>${item.text}</p>
               </div>
             `).join('')}
           </div>`
      }
    </div>
  `;
  openCustomModal('سجل البصيرة والإتقان الشخصي', html);
}

function resetAdaptiveJourney() {
  stopStudioAudio();
  engine.reset();
  loadKC('KC1', true);
}

/* مشغّل المقاطع الصوتية المسجّلة في الاستوديو (Studio Pre-Recorded Audio Player) */
let activeAudioKind = null;

function getStudioAudioPath(kcId, kind) {
  const num = String(kcId.replace('KC', '')).padStart(2, '0');
  const suffix = kind === 'summary' ? 'summary' : 'intro';
  return `assets/audio/kc${num}_${suffix}.mp3`;
}

function cardAudioButtonHtml(kind) {
  const isSummary = kind === 'summary';
  return `<button type="button" class="icon-btn audio-play-btn" data-audio-kind="${kind}" onclick="playStudioTrack('${kind}')">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <span data-audio-label="${kind}">${isSummary ? 'استماع لمقطع التأصيل' : 'استماع لمقطع التمهيد'}</span>
  </button>`;
}

function resetStudioAudioUI() {
  document.querySelectorAll('[data-audio-kind]').forEach(btn => btn.classList.remove('speaking'));
  document.querySelectorAll('[data-audio-label="intro"]').forEach(el => { el.textContent = 'استماع لمقطع التمهيد'; });
  document.querySelectorAll('[data-audio-label="summary"]').forEach(el => { el.textContent = 'استماع لمقطع التأصيل'; });
  document.querySelectorAll('[data-audio-note]').forEach(el => { el.classList.remove('visible'); el.textContent = ''; });
}

function showAudioNote(kind, src) {
  document.querySelectorAll(`[data-audio-note="${kind}"]`).forEach(el => {
    el.textContent = `تعذّر تشغيل هذا المقطع، ويُربط ملفه عند إضافته في المسار: ${src}`;
    el.classList.add('visible');
  });
}

function stopStudioAudio() {
  const audioEl = $('studio-audio-el');
  if (audioEl) {
    audioEl.pause();
    audioEl.removeAttribute('src');
  }
  activeAudioKind = null;
  resetStudioAudioUI();
}

function playStudioTrack(kind) {
  const audioEl = $('studio-audio-el');
  if (!audioEl) return;

  const kcId = engine.state.activeKC || 'KC1';
  const src = getStudioAudioPath(kcId, kind);

  if (activeAudioKind === kind && !audioEl.paused) {
    audioEl.pause();
    activeAudioKind = null;
    resetStudioAudioUI();
    return;
  }

  resetStudioAudioUI();
  activeAudioKind = kind;
  audioEl.src = src;

  audioEl.onended = () => {
    activeAudioKind = null;
    resetStudioAudioUI();
  };

  audioEl.onerror = () => {
    activeAudioKind = null;
    resetStudioAudioUI();
    showAudioNote(kind, src);
  };

  document.querySelectorAll(`[data-audio-kind="${kind}"]`).forEach(btn => btn.classList.add('speaking'));
  document.querySelectorAll(`[data-audio-label="${kind}"]`).forEach(el => { el.textContent = 'إيقاف المقطع'; });
  audioEl.play().catch(() => {
    activeAudioKind = null;
    resetStudioAudioUI();
    showAudioNote(kind, src);
  });
}

/* التشغيل الأولي عند فتح الصفحة */
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeConceptMap(); });
window.addEventListener('DOMContentLoaded', () => {
  const initialKC = engine.state.activeKC && KNOWLEDGE_SPACE[engine.state.activeKC]
    ? engine.state.activeKC
    : 'KC1';
  loadKC(initialKC, true);
});
</script>
